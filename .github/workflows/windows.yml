name: ET Windows

on:
  push:
    # 仅 releases/** 自动构建；main/dev 推送不触发
    branches: ["releases/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      RELEVANT_PATHS: >-
        ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**",
        "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "easytier/**",
        "easytier-core/**", "easytier-proto/**", "easytier-rpc-build/**",
        "easytier-gui/**", "tauri-plugin-vpnservice/**",
        "easytier-web/**", ".github/workflows/windows.yml",
        ".github/actions/**"]
    outputs:
      # Release builds must run even if they only change release metadata.
      should_skip: >-
        ${{
          (
            steps.skip_check.outputs.should_skip == 'true' ||
            (
              github.event_name == 'pull_request' &&
              steps.path_filter.outputs.relevant != 'true'
            )
          ) &&
          !startsWith(github.ref_name, 'releases/')
        }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          cancel_others: 'true'
          paths: ${{ env.RELEVANT_PATHS }}

      - id: path_filter
        if: >-
          github.event_name == 'pull_request' &&
          steps.skip_check.outputs.should_skip != 'true'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant: ${{ env.RELEVANT_PATHS }}

  build-gui:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Windows (x86_64): ET 安装包 + GUI 内置 core
          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
            GUI_TARGET: x86_64-pc-windows-msvc
            ARTIFACT_NAME: windows-x86_64

    runs-on: ${{ matrix.OS }}
    env:
      NAME: easytier
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
      GUI_TARGET: ${{ matrix.GUI_TARGET }}
      OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'    
    steps:
      - uses: actions/checkout@v5

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: true
          pnpm: true
          # 空 filter = 编全部 workspace（GUI + vpnservice + web frontend + config-generator wasm）。
          # Windows 同时出安装包与 ET-web-embed，不能像 Android 那样收窄并关掉 wasm。
          # 不可写成仅 ./easytier-web/*，否则 GUI vue-tsc 找不到 vpn 插件类型。
          pnpm-build-filter: ''
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          # The prefix cache key, this can be changed to start a new cache manually.
          # default: "v0-rust"
          prefix-key: ""
          shared-key: "gui-registry"
          cache-targets: "false"

      - name: copy correct DLLs
        if: ${{ contains(matrix.GUI_TARGET, 'windows') }}
        run: |
          case $TARGET in
              x86_64*)  ARCH_DIR=x86_64 ;;
              i686*)    ARCH_DIR=i686 ;;
              aarch64*) ARCH_DIR=arm64 ;;
          esac
          if [[ -n "$ARCH_DIR" ]]; then
              find "./easytier/third_party/${ARCH_DIR}" -maxdepth 1 -type f \( -name "*.dll" -o -name "*.sys" \) -exec cp {} ./easytier-gui/src-tauri/ \;
          fi

      # NSIS / WiX / WebView2 bootstrapper live under %LOCALAPPDATA%\tauri on Windows.
      - name: Cache Tauri bundler tools
        if: ${{ contains(matrix.GUI_TARGET, 'windows') }}
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-windows-${{ runner.arch }}-v1

      - name: Validate macOS signing secrets
        if: ${{ contains(matrix.GUI_TARGET, 'darwin') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing macOS signing secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Build GUI
        if: ${{ matrix.GUI_TARGET != '' && (!contains(matrix.GUI_TARGET, 'darwin') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) }}
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ./easytier-gui
          args: --verbose --target ${{ matrix.GUI_TARGET }}

      - name: Build GUI (signed and notarized)
        if: ${{ contains(matrix.GUI_TARGET, 'darwin') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        timeout-minutes: 60
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ./easytier-gui
          args: --verbose --target ${{ matrix.GUI_TARGET }}

      - name: Notarize and staple macOS DMG
        if: ${{ contains(matrix.GUI_TARGET, 'darwin') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        timeout-minutes: 45
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          dmg_dir="./target/$GUI_TARGET/release/bundle/dmg"
          if [[ ! -d "$dmg_dir" ]]; then
            printf 'macOS DMG directory not found: %s\n' "$dmg_dir" >&2
            exit 1
          fi

          dmgs=()
          while IFS= read -r dmg; do
            dmgs+=("$dmg")
          done < <(find "$dmg_dir" -maxdepth 1 -type f -name "*.dmg" | sort)
          if (( ${#dmgs[@]} == 0 )); then
            printf 'No macOS DMG found in %s\n' "$dmg_dir" >&2
            exit 1
          fi

          for dmg in "${dmgs[@]}"; do
            printf 'Verifying signed DMG: %s\n' "$dmg"
            codesign --verify --verbose=4 "$dmg"
            codesign -dv --verbose=4 "$dmg"

            printf 'Notarizing DMG: %s\n' "$dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --timeout 40m

            printf 'Stapling DMG: %s\n' "$dmg"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      # One cargo invocation shares dependency compilation between web-embed and core/cli.
      - name: Build headless Windows binaries (web-embed + core/cli)
        if: ${{ contains(matrix.GUI_TARGET, 'windows') }}
        run: |
          set -euo pipefail
          test -f easytier-web/frontend/dist/index.html
          cargo build --release --target "$TARGET" \
            -p easytier-web \
            -p easytier \
            --features easytier-web/embed
          mv ./target/$TARGET/release/easytier-web.exe ./target/$TARGET/release/easytier-web-embed.exe

      - name: Collect GUI artifact
        run: |
          mkdir -p ./artifacts/objects/
          
          if [[ $GITHUB_REF_TYPE =~ ^tag$ ]]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=$GITHUB_SHA
          fi

          # copy gui bundle, gui is built without specific target
          if [[ $GUI_TARGET =~ windows ]]; then
              mv ./target/$GUI_TARGET/release/bundle/nsis/*.exe ./artifacts/objects/
          elif [[ $GUI_TARGET =~ darwin ]]; then
              mv ./target/$GUI_TARGET/release/bundle/dmg/*.dmg ./artifacts/objects/
          elif [[ $GUI_TARGET =~ linux ]]; then
              mv ./target/$GUI_TARGET/release/bundle/deb/*.deb ./artifacts/objects/
              mv ./target/$GUI_TARGET/release/bundle/rpm/*.rpm ./artifacts/objects/
              mv ./target/$GUI_TARGET/release/bundle/appimage/*.AppImage ./artifacts/objects/
          fi

          mv ./artifacts/objects/* ./artifacts/
          rm -rf ./artifacts/objects/

      - name: Archive GUI artifact
        uses: actions/upload-artifact@v5
        with:
          name: ET-gui-${{ matrix.ARTIFACT_NAME }}
          path: |
            ./artifacts/*

      - name: Collect headless Windows binaries
        if: ${{ contains(matrix.GUI_TARGET, 'windows') }}
        run: |
          set -euo pipefail
          mkdir -p ./headless/objects
          declare -A RENAME=(
            [easytier-core]=ET-core
            [easytier-cli]=ET-cli
            [easytier-web-embed]=ET-web-embed
          )
          for SRC in easytier-core easytier-cli easytier-web-embed; do
            BIN="./target/$TARGET/release/${SRC}.exe"
            if [[ -f "$BIN" ]]; then
              cp "$BIN" "./headless/objects/${RENAME[$SRC]}.exe"
            fi
          done
          # Runtime DLLs / drivers next to binaries
          case $TARGET in
              x86_64*)  ARCH_DIR=x86_64 ;;
              i686*)    ARCH_DIR=i686 ;;
              aarch64*) ARCH_DIR=arm64 ;;
          esac
          if [[ -n "${ARCH_DIR:-}" && -d "./easytier/third_party/${ARCH_DIR}" ]]; then
              find "./easytier/third_party/${ARCH_DIR}" -maxdepth 1 -type f \( -name "*.dll" -o -name "*.sys" \) \
                -exec cp {} ./headless/objects/ \;
          fi
          test -f ./headless/objects/ET-core.exe
          test -f ./headless/objects/ET-cli.exe
          test -f ./headless/objects/ET-web-embed.exe
          mv ./headless/objects/* ./headless/
          rm -rf ./headless/objects
          ls -la ./headless/

      - name: Archive headless Windows artifact
        if: ${{ contains(matrix.GUI_TARGET, 'windows') }}
        uses: actions/upload-artifact@v5
        with:
          name: ET-${{ matrix.ARTIFACT_NAME }}
          path: |
            ./headless/*

  gui-result:
    runs-on: ubuntu-latest
    needs: [ pre_job, build-gui ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
