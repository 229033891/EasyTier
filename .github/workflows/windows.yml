name: ET Windows

on:
  push:
    # 仅 releases/** 自动构建；main/dev 推送不触发
    branches: ["releases/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      RELEVANT_PATHS: >-
        ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**",
        "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "easytier/**",
        "easytier-core/**", "easytier-proto/**", "easytier-rpc-build/**",
        "easytier-gui/**", "tauri-plugin-vpnservice/**",
        "easytier-web/**", ".github/workflows/windows.yml",
        ".github/actions/**"]
    outputs:
      # Skip when no RELEVANT_PATHS changed (e.g. docs-only). Code / workflow /
      # lockfile / release-metadata under those globs still force a full run.
      should_skip: >-
        ${{
          steps.skip_check.outputs.should_skip == 'true' ||
          (
            github.event_name == 'pull_request' &&
            steps.path_filter.outputs.relevant != 'true'
          )
        }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          cancel_others: 'true'
          paths: ${{ env.RELEVANT_PATHS }}

      - id: path_filter
        if: >-
          github.event_name == 'pull_request' &&
          steps.skip_check.outputs.should_skip != 'true'
        uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        with:
          filters: |
            relevant: ${{ env.RELEVANT_PATHS }}

  # Web frontend for ET-web-embed (ubuntu; parallel with GUI). Same pattern as ET Linux.
  build_web:
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Frontend Environment
        uses: ./.github/actions/prepare-pnpm
        with:
          token: ${{ github.token }}
          build-filter: './easytier-web/*'

      - name: Archive web dashboard dist
        uses: actions/upload-artifact@v7
        with:
          name: ET-web-dashboard-windows
          path: |
            easytier-web/frontend/dist/*

  # Desktop product: NSIS (ET.exe embeds core + ET-cli sidecar). No headless here.
  build-gui:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Windows (x86_64): ET 安装包 + GUI 内置 core
          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
            GUI_TARGET: x86_64-pc-windows-msvc
            ARTIFACT_NAME: windows-x86_64

    runs-on: ${{ matrix.OS }}
    env:
      NAME: easytier
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
      GUI_TARGET: ${{ matrix.GUI_TARGET }}
      OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: true
          pnpm: true
          # GUI + workspace deps (frontend-lib, tauri-plugin-vpnservice-api).
          # Web frontend / wasm for embed runs on build_web + build-web-embed.
          # Matching Android: plain "easytier-gui" skips vpnservice dist-js.
          pnpm-build-filter: 'easytier-gui...'
          pnpm-setup-wasm: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ""
          shared-key: "gui-registry"
          cache-targets: "false"

      - name: copy correct DLLs
        if: ${{ contains(matrix.GUI_TARGET, 'windows') }}
        run: |
          case $TARGET in
              x86_64*)  ARCH_DIR=x86_64 ;;
              i686*)    ARCH_DIR=i686 ;;
              aarch64*) ARCH_DIR=arm64 ;;
          esac
          if [[ -n "$ARCH_DIR" ]]; then
              find "./easytier/third_party/${ARCH_DIR}" -maxdepth 1 -type f \( -name "*.dll" -o -name "*.sys" \) -exec cp {} ./easytier-gui/src-tauri/ \;
          fi

      # NSIS / WiX / WebView2 bootstrapper live under %LOCALAPPDATA%\tauri on Windows.
      - name: Cache Tauri bundler tools
        if: ${{ contains(matrix.GUI_TARGET, 'windows') }}
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-windows-${{ runner.arch }}-v1

      - name: Validate macOS signing secrets
        if: ${{ contains(matrix.GUI_TARGET, 'darwin') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing macOS signing secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      # prepare-build already ran `pnpm --filter easytier-gui... build`.
      # Skip Tauri beforeBuildCommand so the GUI frontend is not built twice.
      - name: Verify GUI frontend dist
        if: ${{ matrix.GUI_TARGET != '' }}
        run: |
          set -euo pipefail
          test -f easytier-gui/dist/index.html
          # Path is relative to projectPath (easytier-gui/), not src-tauri/.
          # Deep-merged by `tauri build --config`; only clears beforeBuildCommand.
          printf '%s\n' '{"build":{"beforeBuildCommand":""}}' \
            > easytier-gui/tauri.ci.conf.json

      # Tauri externalBin (desktop platform conf → binaries/ET-cli). Must exist
      # before `tauri build`. Not in base tauri.conf.json — Android must not
      # require this sidecar.
      - name: Stage ET-cli sidecar for GUI bundle
        if: ${{ matrix.GUI_TARGET != '' }}
        run: |
          set -euo pipefail
          cargo build --release --target "$GUI_TARGET" -p easytier --bin easytier-cli
          mkdir -p easytier-gui/src-tauri/binaries
          TARGET_ROOT="${CARGO_TARGET_DIR:-./target}"
          if [[ "$GUI_TARGET" == *windows* ]]; then
            src="$TARGET_ROOT/$GUI_TARGET/release/easytier-cli.exe"
            dst="easytier-gui/src-tauri/binaries/ET-cli-${GUI_TARGET}.exe"
          else
            src="$TARGET_ROOT/$GUI_TARGET/release/easytier-cli"
            dst="easytier-gui/src-tauri/binaries/ET-cli-${GUI_TARGET}"
          fi
          test -f "$src"
          cp -f "$src" "$dst"
          ls -la "$dst"

      - name: Build GUI
        if: ${{ matrix.GUI_TARGET != '' && (!contains(matrix.GUI_TARGET, 'darwin') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: ./easytier-gui
          args: --verbose --target ${{ matrix.GUI_TARGET }} --config tauri.ci.conf.json

      - name: Build GUI (signed and notarized)
        if: ${{ contains(matrix.GUI_TARGET, 'darwin') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        timeout-minutes: 60
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ./easytier-gui
          args: --verbose --target ${{ matrix.GUI_TARGET }} --config tauri.ci.conf.json

      - name: Notarize and staple macOS DMG
        if: ${{ contains(matrix.GUI_TARGET, 'darwin') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        timeout-minutes: 45
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          dmg_dir="./target/$GUI_TARGET/release/bundle/dmg"
          if [[ ! -d "$dmg_dir" ]]; then
            printf 'macOS DMG directory not found: %s\n' "$dmg_dir" >&2
            exit 1
          fi

          dmgs=()
          while IFS= read -r dmg; do
            dmgs+=("$dmg")
          done < <(find "$dmg_dir" -maxdepth 1 -type f -name "*.dmg" | sort)
          if (( ${#dmgs[@]} == 0 )); then
            printf 'No macOS DMG found in %s\n' "$dmg_dir" >&2
            exit 1
          fi

          for dmg in "${dmgs[@]}"; do
            printf 'Verifying signed DMG: %s\n' "$dmg"
            codesign --verify --verbose=4 "$dmg"
            codesign -dv --verbose=4 "$dmg"

            printf 'Notarizing DMG: %s\n' "$dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --timeout 40m

            printf 'Stapling DMG: %s\n' "$dmg"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Collect GUI artifact
        run: |
          mkdir -p ./artifacts/objects/

          if [[ $GITHUB_REF_TYPE =~ ^tag$ ]]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=$GITHUB_SHA
          fi

          if [[ $GUI_TARGET =~ windows ]]; then
              mv ./target/$GUI_TARGET/release/bundle/nsis/*.exe ./artifacts/objects/
          elif [[ $GUI_TARGET =~ darwin ]]; then
              mv ./target/$GUI_TARGET/release/bundle/dmg/*.dmg ./artifacts/objects/
          elif [[ $GUI_TARGET =~ linux ]]; then
              # Linux desktop GUI ships from ET Linux (linux.yml → ET-linux-*-gui).
              # Kept here if a linux matrix row is re-enabled on this workflow.
              shopt -s nullglob
              for f in \
                ./target/$GUI_TARGET/release/bundle/deb/*.deb \
                ./target/$GUI_TARGET/release/bundle/rpm/*.rpm \
                ./target/$GUI_TARGET/release/bundle/appimage/*.AppImage
              do
                mv "$f" ./artifacts/objects/
              done
              shopt -u nullglob
          fi

          built=(./artifacts/objects/*)
          if (( ${#built[@]} == 0 )); then
            echo "::error::No GUI package files collected for $GUI_TARGET"
            exit 1
          fi
          mv ./artifacts/objects/* ./artifacts/
          rm -rf ./artifacts/objects/

      - name: Archive GUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ET-${{ matrix.ARTIFACT_NAME }}-gui
          path: |
            ./artifacts/*

  # Headless node: ET-core + ET-cli (+ drivers). No web console.
  build-headless:
    strategy:
      fail-fast: true
      matrix:
        include:
          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
            ARTIFACT_NAME: windows-x86_64

    runs-on: ${{ matrix.OS }}
    env:
      NAME: easytier
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
      OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ""
          shared-key: "headless-windows-registry"
          cache-targets: "false"

      - name: Build headless Windows binaries (core + cli)
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET" -p easytier

      - name: Collect headless Windows binaries
        run: |
          set -euo pipefail
          mkdir -p ./headless/objects
          cp ./target/$TARGET/release/easytier-core.exe ./headless/objects/ET-core.exe
          cp ./target/$TARGET/release/easytier-cli.exe ./headless/objects/ET-cli.exe
          case $TARGET in
              x86_64*)  ARCH_DIR=x86_64 ;;
              i686*)    ARCH_DIR=i686 ;;
              aarch64*) ARCH_DIR=arm64 ;;
          esac
          if [[ -n "${ARCH_DIR:-}" && -d "./easytier/third_party/${ARCH_DIR}" ]]; then
              find "./easytier/third_party/${ARCH_DIR}" -maxdepth 1 -type f \( -name "*.dll" -o -name "*.sys" \) \
                -exec cp {} ./headless/objects/ \;
          fi
          test -f ./headless/objects/ET-core.exe
          test -f ./headless/objects/ET-cli.exe
          mv ./headless/objects/* ./headless/
          rm -rf ./headless/objects
          ls -la ./headless/

      - name: Archive headless Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ET-${{ matrix.ARTIFACT_NAME }}
          path: |
            ./headless/*

  # Web console product only: ET-web-embed.exe
  build-web-embed:
    strategy:
      fail-fast: true
      matrix:
        include:
          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
            ARTIFACT_NAME: windows-x86_64

    runs-on: ${{ matrix.OS }}
    env:
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
    needs:
      - pre_job
      - build_web
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Download web dashboard dist
        uses: actions/download-artifact@v8
        with:
          name: ET-web-dashboard-windows
          path: easytier-web/frontend/dist/

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ""
          shared-key: "web-embed-windows-registry"
          cache-targets: "false"

      - name: Verify web embed frontend dist
        run: |
          set -euo pipefail
          test -f easytier-web/frontend/dist/index.html
          test -d easytier-web/frontend/dist/config-generator

      - name: Build ET-web-embed
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET" \
            -p easytier-web \
            --features easytier-web/embed
          mv ./target/$TARGET/release/easytier-web.exe ./target/$TARGET/release/easytier-web-embed.exe

      - name: Collect web console artifact
        run: |
          set -euo pipefail
          mkdir -p ./webconsole
          cp ./target/$TARGET/release/easytier-web-embed.exe ./webconsole/ET-web-embed.exe
          test -f ./webconsole/ET-web-embed.exe
          ls -la ./webconsole/

      - name: Archive web console artifact
        uses: actions/upload-artifact@v7
        with:
          name: ET-${{ matrix.ARTIFACT_NAME }}-web
          path: |
            ./webconsole/*

  windows-result:
    runs-on: ubuntu-latest
    needs: [ pre_job, build_web, build-gui, build-headless, build-web-embed ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
