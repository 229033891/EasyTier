name: ET Release

on:
  workflow_dispatch:
    inputs:
      core_run_id:
        description: 'The run id of ET Linux Action in EasyTier repo'
        type: number
        required: true
      gui_run_id:
        description: 'The run id of ET Windows Action in EasyTier repo'
        type: number
        required: true
      mobile_run_id:
        description: 'The run id of ET Android Action in EasyTier repo'
        type: number
        required: true
      openwrt_run_id:
        description: 'The run id of ET OpenWrt Action in EasyTier repo'
        type: number
        required: false
        default: 0
      version:
        description: 'Version for this release'
        type: string
        default: 'v2.7.0'
        required: true
      make_latest:
        description: 'Mark this release as latest'
        type: boolean
        default: true
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5

      - name: Download Core Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.core_run_id }}
          repo: ${{ github.repository }}
          path: release_assets

      - name: Download GUI Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.gui_run_id }}
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Download Mobile Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.mobile_run_id }}
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Download OpenWrt Artifact
        if: ${{ inputs.openwrt_run_id > 0 }}
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.openwrt_run_id }}
          repo: ${{ github.repository }}
          path: release_assets

      - name: Zip release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir zipped_assets

          find release_assets_nozip -type f -exec mv {} zipped_assets \;
          ls -l -R ./zipped_assets

          cd release_assets
          ls -l -R ./
          chmod -R 755 .
          for x in `ls`; do
            # openwrt-bins / ET-web-dashboard 是中间产物 (裸二进制 / 前端静态文件), 不发版
            if [ "$x" = "openwrt-bins" ] || [ "$x" = "ET-web-dashboard" ]; then
              continue
            fi
            zip -r ../zipped_assets/$x-${VERSION}.zip $x;
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.version }}
          draft: true
          files: |
            ./zipped_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
