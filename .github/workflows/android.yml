name: ET Android

on:
  push:
    # 仅 releases/** 自动构建；main/dev 推送不触发
    branches: ["releases/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      RELEVANT_PATHS: >-
        ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**",
        "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "easytier/**",
        "easytier-core/**", "easytier-proto/**", "easytier-rpc-build/**",
        "easytier-gui/**", "tauri-plugin-vpnservice/**",
        "easytier-web/frontend-lib/**", ".github/workflows/android.yml",
        ".github/actions/**"]
    outputs:
      # Skip when no RELEVANT_PATHS changed (e.g. docs-only). Code / workflow /
      # lockfile / release-metadata under those globs still force a full run.
      should_skip: >-
        ${{
          steps.skip_check.outputs.should_skip == 'true' ||
          (
            github.event_name == 'pull_request' &&
            steps.path_filter.outputs.relevant != 'true'
          )
        }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          cancel_others: 'true'
          paths: ${{ env.RELEVANT_PATHS }}

      - id: path_filter
        if: >-
          github.event_name == 'pull_request' &&
          steps.skip_check.outputs.should_skip != 'true'
        uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        with:
          filters: |
            relevant: ${{ env.RELEVANT_PATHS }}

  build-mobile:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Android arm64-v8a: ET.apk (Android 包, 与 OpenWrt apk 不同)
          - TARGET: aarch64-linux-android
            ARCH: aarch64
    runs-on: ubuntu-latest
    env:
      NAME: easytier
      TARGET: ${{ matrix.TARGET }}
      ARCH: ${{ matrix.ARCH }}
      OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'    
    steps:
      - uses: actions/checkout@v5

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Ensure NDK parent dir is writable before cache restore (system SDK path).
      - name: Prepare Android NDK cache directory
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/ndk
          sudo chmod -R a+rwx /usr/local/lib/android/sdk/ndk

      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/26.0.10792818
          key: android-ndk-26.0.10792818-${{ runner.os }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12.0
          packages: 'build-tools;34.0.0 ndk;26.0.10792818 platform-tools platforms;android-34 '

      - name: Setup Android Environment
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/ndk/26.0.10792818/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.0.10792818/" >> $GITHUB_ENV

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: true
          # GUI + workspace deps (frontend-lib, tauri-plugin-vpnservice-api).
          # Plain "easytier-gui" skips vpnservice dist-js (gitignored) and breaks vue-tsc.
          # Do NOT build web frontend / config-generator wasm.
          pnpm-build-filter: 'easytier-gui...'
          pnpm-setup-wasm: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The prefix cache key, this can be changed to start a new cache manually.
          # default: "v0-rust"
          prefix-key: ""
          shared-key: "gui-registry"
          cache-targets: "false"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('easytier-gui/src-tauri/gen/android/**/*.gradle*', 'easytier-gui/src-tauri/gen/android/**/gradle-wrapper.properties', 'tauri-plugin-vpnservice/android/**/*.gradle*') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Build
        run: |
          cd easytier-gui
          pnpm tauri android build --apk --target "$ARCH" --split-per-abi

      - name: Collect artifact
        run: |
          mkdir -p ./artifacts/objects/
          mv easytier-gui/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk ./artifacts/objects/
          
          if [[ $GITHUB_REF_TYPE =~ ^tag$ ]]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=$GITHUB_SHA
          fi

          for apk in ./artifacts/objects/*.apk; do
            [[ -f "$apk" ]] || continue
            abi=$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            if [[ "$abi" == "$(basename "$apk")" ]]; then
              abi="universal"
            fi
            mv "$apk" "./artifacts/objects/ET-android-${abi}.apk"
          done

          mv ./artifacts/objects/* ./artifacts/
          rm -rf ./artifacts/objects/

      - name: Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: ET-mobile-android-${{ matrix.ARCH }}
          path: |
            ./artifacts/*

  mobile-result:
    runs-on: ubuntu-latest
    needs: [ pre_job, build-mobile ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
