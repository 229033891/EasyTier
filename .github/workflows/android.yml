name: ET Android

on:
  push:
    # 仅 releases/** 自动构建；main/dev 推送不触发
    branches: ["releases/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      RELEVANT_PATHS: >-
        ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**",
        "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "easytier/**",
        "easytier-core/**", "easytier-proto/**", "easytier-rpc-build/**",
        "easytier-gui/**", "tauri-plugin-vpnservice/**",
        "easytier-web/frontend-lib/**", ".github/workflows/android.yml",
        ".github/actions/**"]
    outputs:
      # Skip when no RELEVANT_PATHS changed (e.g. docs-only). Code / workflow /
      # lockfile / release-metadata under those globs still force a full run.
      should_skip: >-
        ${{
          steps.skip_check.outputs.should_skip == 'true' ||
          (
            github.event_name == 'pull_request' &&
            steps.path_filter.outputs.relevant != 'true'
          )
        }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          cancel_others: 'true'
          paths: ${{ env.RELEVANT_PATHS }}

      - id: path_filter
        if: >-
          github.event_name == 'pull_request' &&
          steps.skip_check.outputs.should_skip != 'true'
        uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        with:
          filters: |
            relevant: ${{ env.RELEVANT_PATHS }}

  build-mobile:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Android arm64-v8a: ET.apk (Android 包, 与 OpenWrt apk 不同)
          - TARGET: aarch64-linux-android
            ARCH: aarch64
    runs-on: ubuntu-latest
    env:
      NAME: easytier
      TARGET: ${{ matrix.TARGET }}
      ARCH: ${{ matrix.ARCH }}
      OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'    
    steps:
      - uses: actions/checkout@v5

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Ensure NDK parent dir is writable before cache restore (system SDK path).
      - name: Prepare Android NDK cache directory
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/ndk
          sudo chmod -R a+rwx /usr/local/lib/android/sdk/ndk

      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/26.0.10792818
          key: android-ndk-26.0.10792818-${{ runner.os }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12.0
          packages: 'build-tools;34.0.0 ndk;26.0.10792818 platform-tools platforms;android-34 '

      - name: Setup Android Environment
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/ndk/26.0.10792818/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.0.10792818/" >> $GITHUB_ENV

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: true
          # GUI + workspace deps (frontend-lib, tauri-plugin-vpnservice-api).
          # Plain "easytier-gui" skips vpnservice dist-js (gitignored) and breaks vue-tsc.
          # Do NOT build web frontend / config-generator wasm.
          pnpm-build-filter: 'easytier-gui...'
          pnpm-setup-wasm: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The prefix cache key, this can be changed to start a new cache manually.
          # default: "v0-rust"
          prefix-key: ""
          shared-key: "gui-registry"
          cache-targets: "false"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('easytier-gui/src-tauri/gen/android/**/*.gradle*', 'easytier-gui/src-tauri/gen/android/**/gradle-wrapper.properties', 'tauri-plugin-vpnservice/android/**/*.gradle*') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Build
        run: |
          cd easytier-gui
          pnpm tauri android build --apk --target "$ARCH" --split-per-abi

      - name: Collect artifact
        run: |
          mkdir -p ./artifacts/objects/
          mv easytier-gui/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk ./artifacts/objects/
          
          # 版本号：优先取分支名 releases/vX.Y.Z（与 release tag 一致），
          # 回退到 tauri.conf.json 的 version；两者都拿不到就不加版本号。
          VERSION=""
          if [[ "$GITHUB_REF_NAME" == releases/v* ]]; then
            VERSION="${GITHUB_REF_NAME#releases/}"
          elif [[ -f easytier-gui/src-tauri/tauri.conf.json ]]; then
            VERSION="$(sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' easytier-gui/src-tauri/tauri.conf.json | head -1 || true)"
            if [[ -n "$VERSION" ]]; then
              VERSION="v${VERSION}"
            fi
          fi

          SUFFIX=""
          if [[ -n "$VERSION" ]]; then
            SUFFIX="-${VERSION}"
          else
            echo "::warning::could not resolve version; APK name will omit it"
          fi
          echo "APK name suffix: '${SUFFIX}'"

          for apk in ./artifacts/objects/*.apk; do
            [[ -f "$apk" ]] || continue
            abi=$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            if [[ "$abi" == "$(basename "$apk")" ]]; then
              abi="universal"
            fi
            # ET-{os}-{arch}-{version}.apk (os=android; arch from APK abi tag)
            mv "$apk" "./artifacts/objects/ET-android-${abi}${SUFFIX}.apk"
          done

          mv ./artifacts/objects/* ./artifacts/
          rm -rf ./artifacts/objects/

      - name: Verify APK signatures
        # Regression guard for the "安装包没有签名文件" report: OEM installers need the
        # v1 JAR signature (META-INF/*.RSA), and a signing config that silently produces
        # a v2-only APK is otherwise only noticed by end users. keytool re-computes every
        # JAR digest, so a repacked APK is caught here too.
        run: |
          set -euo pipefail
          # Newest build-tools available on the runner. The workflow installs
          # build-tools;34.0.0, but runner images may ship newer revisions (e.g. 37) and
          # any apksigner that knows v2+v3 schemes verifies the same set here.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -z "${APKSIGNER}" || ! -x "${APKSIGNER}" ]]; then
            echo "::error::apksigner not found under $SDK/build-tools"
            exit 1
          fi
          echo "Using ${APKSIGNER}"

          shopt -s nullglob
          apks=(./artifacts/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::no APK under ./artifacts — nothing was built"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            name="$(basename "$apk")"
            echo "::group::Verify ${name}"

            # v1: JAR signature present and every MANIFEST entry digest valid.
            if ! keytool -printcert -jarfile "$apk" > /dev/null 2>&1; then
              echo "::error::${name} has no valid v1 JAR signature (META-INF/*.RSA); OEM installers reject it as unsigned"
              exit 1
            fi

            # v2/v3: signing block must verify, and v1/v2 must be reported as verified.
            # --min-sdk-version 23 matters: for an APK whose manifest minSdkVersion >= 24,
            # apksigner skips JAR (v1) verification entirely once v2/v3 signatures are found
            # (apksig ApkVerifier does not run V1SchemeVerifier in that range) and the -v
            # report then shows "Verified using v1 scheme: false" even for a perfectly
            # valid JAR signature. Forcing the range to start below API 24 makes apksigner
            # actually verify the JAR signature, so the v1 grep below is deterministic.
            report="$("${APKSIGNER}" verify --verbose --print-certs --min-sdk-version 23 "$apk")" || {
              echo "::error::${name} failed apksigner verification"
              exit 1
            }
            echo "$report"
            grep -q 'Verified using v1 scheme (JAR signing): true' <<<"${report}" || {
              echo "::error::${name} is missing the v1 (JAR) signature"
              exit 1
            }
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' <<<"${report}" || {
              echo "::error::${name} is missing the v2 (APK Signature Scheme v2) signature"
              exit 1
            }
            # v3 is best-effort (Android 9+ installers); do not fail the build on it.
            grep 'Verified using v3 scheme (APK Signature Scheme v3):' <<<"${report}" || true
            echo "::endgroup::"
          done

      - name: Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: ET-android-${{ matrix.ARCH }}
          path: |
            ./artifacts/*

  mobile-result:
    runs-on: ubuntu-latest
    needs: [ pre_job, build-mobile ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
