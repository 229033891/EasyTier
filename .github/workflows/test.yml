name: ET Test

on:
  push:
    # 仅 releases/** 自动测试；main/dev 推送不触发
    branches: [ "releases/**" ]
  # PR 必须跑：传输矩阵与 feature 门控的回归正是靠这里暴露的，
  # 只在 releases/** 跑会让它们一直积累到发版才被发现。
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    env:
      # Docs / markdown-only changes are outside this list → skip-duplicate skips.
      RELEVANT_PATHS: >-
        ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**",
        "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "easytier/**",
        "easytier-core/**", "easytier-proto/**", "easytier-rpc-build/**",
        "easytier-benches/**",
        "easytier-web/**", "easytier-gui/src-tauri/**",
        "tauri-plugin-vpnservice/**", "easytier-contrib/**",
        ".github/workflows/test.yml", ".github/actions/**"]
    outputs:
      should_skip: >-
        ${{
          steps.skip_check.outputs.should_skip == 'true' ||
          (
            github.event_name == 'pull_request' &&
            steps.path_filter.outputs.relevant != 'true'
          )
        }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          concurrent_skipping: 'never'
          skip_after_successful_duplicate: 'true'
          paths: ${{ env.RELEVANT_PATHS }}

      - id: path_filter
        if: >-
          github.event_name == 'pull_request' &&
          steps.skip_check.outputs.should_skip != 'true'
        uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        with:
          filters: |
            relevant: ${{ env.RELEVANT_PATHS }}

  check-fmt:
    name: Check fmt & lockfile
    runs-on: ubuntu-latest
    # 不进镜像：这一步不跑 prepare-build，全部成本就是装 Rust 工具链，与容器
    # 初始化（30–40s）大致相当，容器化换不来收益。
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95
          components: rustfmt
          cache: false
          rustflags: ''

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Cargo.lock is up to date
        run: |
          if ! cargo metadata --format-version 1 --locked > /dev/null; then
            echo "::error::Cargo.lock is out of date. Run cargo generate-lockfile or cargo build locally, then commit Cargo.lock."
            exit 1
          fi

  check-clippy:
    name: Check clippy
    runs-on: ubuntu-latest
    # ET_CI_IMAGE 为空时表达式退化成 {"image":null}，等价于原来的普通 runner。
    # 刻意不容器化 test_matrix / test：它们要 modprobe / /dev/net/tun / NET_ADMIN /
    # BPF 特权，容器 job 拿不到宿主机内核模块，privileged 也不是 container 支持的选项。
    container: >-
      ${{ (vars.ET_CI_IMAGE != '' && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}}}}', vars.ET_CI_IMAGE, github.actor, github.token))) || fromJSON('{"image":null}') }}
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          # --all includes easytier-gui; needs GTK/webkit, not a frontend rebuild.
          gui: true
          pnpm: false
          components: clippy
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Clippy
        run: cargo clippy --all-targets --features full --all -- -D warnings

  check-hack:
    name: Check features
    runs-on: ubuntu-latest
    # 同 check-clippy：镜像可选，未设 ET_CI_IMAGE 时退回普通 runner
    container: >-
      ${{ (vars.ET_CI_IMAGE != '' && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}}}}', vars.ET_CI_IMAGE, github.actor, github.token))) || fromJSON('{"image":null}') }}
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          # easytier --each-feature only; skip GUI apt + pnpm.
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-hack

      - name: Check features
        run: cargo hack check --package easytier --each-feature --exclude-features macos-ne --verbose

  check-wasi:
    name: Check WASI
    runs-on: ubuntu-latest
    # 同 check-clippy；wasm32-wasip1 target 已预装进镜像
    container: >-
      ${{ (vars.ET_CI_IMAGE != '' && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}}}}', vars.ET_CI_IMAGE, github.actor, github.token))) || fromJSON('{"image":null}') }}
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: wasm32-wasip1
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check WASI
        run: >-
          cargo check --package easytier-core --lib --target wasm32-wasip1
          --features management-rpc,proxy-smoltcp-stack,ring-crypto,wasi-crypto-offload

  bench-routing:
    name: Hot-path gates (alloc + bench)
    runs-on: ubuntu-latest
    # 不进镜像：这是 criterion 阈值门禁，跑分对运行环境敏感。保持测点与历史
    # 数据一致，避免容器引入一个无法归因的变量。
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          # Only the core crates are built; skip the GUI apt deps + pnpm.
          gui: false
          pnpm: false
          # Cold build. This is the only job on the bench profile, and sccache
          # has returned a mismatched artifact set for it before. Disabling
          # sccache does not fix E0463; the bench step forces panic=unwind.
          sccache: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # Deterministic gate: the per-packet lookup must not allocate (§12.1).
      # `test-utils` is what exposes the crate-internal table to the test.
      - name: Hot path must not allocate
        run: >-
          cargo test --package easytier-core --features test-utils
          --test hot_path_alloc

      # `--noplot` skips the gnuplot HTML report. Criterion still writes
      # `target/criterion/**/new/estimates.json`, which the gate script reads.
      # harness=false inherits [profile.release] panic=abort. Cargo builds the
      # lib a bench depends on as unwind (rust-lang/cargo#13894), so an abort
      # unit dies with E0463; the env var is the setting we verified locally.
      # The benches live in the dedicated `easytier-benches` crate.
      #
      # History (why the crate exists): the benches used to live in `easytier`,
      # where `cargo bench -p easytier` also builds the package's bins (cargo
      # 1.95 still builds them despite `bench = false`) and pulled in a second
      # `test-utils` variant of `easytier-core` via dev-dependencies, whose
      # unhashed rlib clobbered the normal one (rust-lang/cargo#6313) and
      # killed the run with E0463.
      #
      # Now: `cargo bench -p easytier-benches` never builds the `easytier`
      # package, so its dependency graph holds exactly ONE `easytier-core`
      # feature variant (`test-utils`) and no unhashed-rlib collision is
      # possible. Note that `easytier` itself still carries a `test-utils`
      # dev-dependency (restored in 6bad5ae6 for its own integration tests) —
      # that is harmless here precisely because the bench job does not build
      # that package. Do not move the benches back into `easytier`.
      - name: Run the routing benchmark
        env:
          CARGO_PROFILE_BENCH_PANIC: unwind
        run: >-
          cargo bench --package easytier-benches --bench routing_lookup -- --noplot

      - name: Enforce hot-path thresholds
        run: python3 script/check_routing_bench.py

  check:
    name: Run linters & check
    runs-on: ubuntu-latest
    # `bench-routing` is deliberately NOT in `needs`: criterion timing on shared
    # runners is noisy, and a flaky bench failure should not block the lint/test
    # aggregate. It stays a standalone required-status job, so a real hot-path
    # regression still fails the overall CI run.
    needs: [ pre_job, check-fmt, check-clippy, check-hack, check-wasi ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1

  pre-test:
    name: Build test
    runs-on: ubuntu-latest
    # 只有「编译」这一段进镜像；跑测试的 test_matrix / test 必须留在普通 runner
    # （modprobe tun、/dev/net/tun、sysctl、NET_ADMIN、BPF 特权）。
    container: >-
      ${{ (vars.ET_CI_IMAGE != '' && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}}}}', vars.ET_CI_IMAGE, github.actor, github.token))) || fromJSON('{"image":null}') }}
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          gui: true
          pnpm: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Registry-only cache, same as every other workflow in this repo.
      # Caching `target/` here restored a half-built tree after cancelled runs
      # (concurrency.cancel-in-progress) and made cargo treat `easytier` as
      # Fresh while libeasytier-*.rmeta was gone -> the bins failed with
      # E0463 "can't find crate for `easytier`". Build artifacts are sccache's
      # job; GHA caches are immutable per key, so a poisoned one never heals.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ""
          shared-key: "test-registry"
          cache-targets: "false"

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: nextest

      - name: Archive test
        run: >-
          cargo nextest archive --archive-file tests.tar.zst
          --package easytier --package easytier-core --features full

      - uses: actions/upload-artifact@v7
        with:
          name: tests
          path: tests.tar.zst
          retention-days: 1

  test_matrix:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [ pre_job, pre-test ]
    if: needs.pre_job.outputs.should_skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "easytier"
            opts: "-E 'not test(tests::three_node)' --test-threads 1 --no-fail-fast"

          - name: "three_node"
            opts: "-E 'test(tests::three_node) and not test(subnet_proxy_three_node_test)' --test-threads 1 --no-fail-fast"

          - name: "three_node::subnet_proxy_three_node_test"
            opts: "-E 'test(subnet_proxy_three_node_test)' --test-threads 1 --no-fail-fast"
    steps:
      - uses: actions/checkout@v5

      - name: Setup tools for test
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bridge-utils miniupnpd miniupnpd-iptables iptables

      - name: Setup system for test
        run: |
          sudo modprobe br_netfilter
          sudo modprobe tun
          if [ ! -e /dev/net/tun ]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo sysctl net.bridge.bridge-nf-call-iptables=0
          sudo sysctl net.bridge.bridge-nf-call-ip6tables=0
          sudo sysctl net.ipv6.conf.lo.disable_ipv6=0
          sudo ip addr add 2001:db8::2/64 dev lo

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: nextest

      - name: Download tests
        uses: actions/download-artifact@v8
        with:
          name: tests

      - name: Run tests
        run: |
          sudo prlimit --pid $$ --nofile=1048576:1048576
          # --workspace-remap：archive 是 pre-test 建的，容器模式下那里的工作区是
          # /__w/<repo>/<repo>，而这个 job 跑在普通 runner 的
          # /home/runner/work/<repo>/<repo>。nextest 会把绝对路径写进 archive，
          # 不重映射就直接失败：
          #   error: workspace root manifest at /__w/.../Cargo.toml does not exist
          # 非容器模式（未设 ET_CI_IMAGE）下两边路径相同，这一步是空操作。
          sudo -E env "PATH=$PATH" EASYTIER_LINUX_BPF_INTEGRATION=required \
            cargo nextest run --archive-file tests.tar.zst \
              --workspace-remap "$GITHUB_WORKSPACE" ${{ matrix.opts }}

  test:
    runs-on: ubuntu-latest
    # Keep `bench-routing` out of `check` (noisy criterion), but still gate the
    # overall CI result so a real hot-path regression cannot go green unnoticed.
    needs: [ pre_job, check, test_matrix, bench-routing ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
