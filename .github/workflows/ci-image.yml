name: ET CI Image

# 构建并推送 Linux 构建环境镜像（.github/docker/ci/Dockerfile）。
#
# 为什么单独一个 workflow：镜像里装的是 apt 包、Rust toolchain、protoc 这些
# 变动很慢的东西，没必要挂在每次构建上。只在 Dockerfile / 本文件变更时重建，
# 加一个每周定时重建来吸收 ubuntu:24.04 基础镜像和 apt 源的变化。

on:
  push:
    paths:
      - '.github/docker/**'
      - '.github/workflows/ci-image.yml'
  schedule:
    # 每周一 03:00 UTC 重建，保证基础镜像安全更新能进到 CI 环境
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # 全量装 apt + rust + protoc，冷构建约 6–10 分钟；超时上限兜住僵死
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # GHCR 的仓库路径必须小写；github.repository_owner 可能带大写
      # （上游 EasyTier/EasyTier），所以在这里统一转小写，后续步骤用它的输出。
      - name: Resolve image name
        id: meta
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/easytier-ci" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .github/docker/ci
          file: .github/docker/ci/Dockerfile
          push: true
          # latest 供 linux.yml 使用；sha-* 用于回溯某次构建到底用的哪个镜像
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### CI image"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| image | \`${{ steps.meta.outputs.image }}:latest\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| revision | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
