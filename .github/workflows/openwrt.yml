name: ET OpenWrt

# 生成 OpenWrt x86_64 包 (只要这 6 个):
#   OpenWrt 24.10 (opkg): easytier_<ver>_x86_64.ipk + luci-app-easytier_<ver>_all.ipk
#                         + luci-i18n-easytier-zh-cn_<ver>_all.ipk (中文语言包)
#     opkg install /tmp/easytier_*.ipk /tmp/luci-app-easytier_*.ipk /tmp/luci-i18n-easytier-zh-cn_*.ipk
#   OpenWrt 25.12 (apk):  easytier_<ver>_x86_64.apk + luci-app-easytier_<ver>_all.apk
#                         + luci-i18n-easytier-zh-cn_<ver>_all.apk (中文语言包)
#     apk add --allow-untrusted /tmp/easytier_*.apk /tmp/luci-app-easytier_*.apk /tmp/luci-i18n-easytier-zh-cn_*.apk
#
# 注意: OpenWrt 的 .apk 和 Android 的 easytier-gui.apk 不是同一个东西, 不要混淆.
# LuCI 界面源码来自 https://github.com/EasyTier/luci-app-easytier,
# easytier 主包里的二进制是本仓库现编译的 (core + cli + web-embed), 不是从旧 Release 下载的.

on:
  workflow_dispatch:
  push:
    # 仅 releases/** 自动构建；main/dev 推送不触发
    branches: ["releases/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      RELEVANT_PATHS: >-
        ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**",
        "easytier/**", "easytier-core/**", "easytier-proto/**",
        "easytier-rpc-build/**", "easytier-web/**",
        ".github/workflows/openwrt.yml", ".github/actions/**"]
    outputs:
      should_skip: >-
        ${{
          (
            steps.skip_check.outputs.should_skip == 'true' ||
            (
              github.event_name == 'pull_request' &&
              steps.path_filter.outputs.relevant != 'true'
            )
          ) &&
          !startsWith(github.ref_name, 'releases/')
        }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          cancel_others: 'true'
          paths: ${{ env.RELEVANT_PATHS }}

      - id: path_filter
        if: >-
          github.event_name == 'pull_request' &&
          steps.skip_check.outputs.should_skip != 'true'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant: ${{ env.RELEVANT_PATHS }}

  build-bins:
    # 先编译 x86_64 musl 静态二进制, 供 easytier ipk/apk 打包用.
    # 包含 easytier-core + easytier-cli (+ easytier-web-embed, LuCI 自建控制台用).
    runs-on: ubuntu-24.04
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: x86_64-unknown-linux-musl
          gui: false
          pnpm: true
          pnpm-build-filter: './easytier-web/*'
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ""
          shared-key: "core-registry"
          cache-targets: "false"

      - name: Build
        run: |
          TARGET=x86_64-unknown-linux-musl
          cargo build --release --target $TARGET --package=easytier-web --features=embed
          mv ./target/$TARGET/release/easytier-web ./target/$TARGET/release/easytier-web-embed
          cargo build --release --target $TARGET --package=easytier --features=jemalloc

      - name: Compress
        run: |
          mkdir -p bins
          UPX_VERSION=4.2.4
          UPX_PKG="upx-${UPX_VERSION}-amd64_linux"
          curl -L "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_PKG}.tar.xz" -s | tar xJvf -
          cp "${UPX_PKG}/upx" .
          for BIN in ./target/x86_64-unknown-linux-musl/release/easytier-{core,cli,web-embed}; do
            if [[ -f "$BIN" ]]; then
              ./upx --lzma --best "$BIN" || true
              cp "$BIN" bins/
            fi
          done
          ls -l bins/

      - name: Archive bins
        uses: actions/upload-artifact@v5
        with:
          name: ET-openwrt-bins
          path: bins/*

  build-openwrt:
    # 用 OpenWrt SDK 打包. ipk 给 24.10 (opkg), apk 给 25.12 (apk add).
    # SDK 镜像 tag 对应关系见 https://github.com/openwrt/docker/pkgs/container/sdk,
    # 换版本时改下面的 sdk 即可 (apk 格式用 SNAPSHOT, 与 25.12 通用).
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkgtype: ipk
            sdk: "24.10.2"
          - pkgtype: apk
            sdk: "SNAPSHOT"
    runs-on: ubuntu-latest
    needs: [pre_job, build-bins]
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - name: Checkout EasyTier (取版本号)
        uses: actions/checkout@v5
        with:
          path: easytier-src

      - name: Checkout luci-app-easytier (打包 feed)
        uses: actions/checkout@v5
        with:
          repository: EasyTier/luci-app-easytier
          ref: main
          path: feed

      - name: Download bins
        uses: actions/download-artifact@v4
        with:
          name: ET-openwrt-bins
          path: feed/easytier/bins/

      - name: Prepare feed (版本号 + 本地二进制)
        run: |
          python3 - <<'EOF'
          import re, pathlib
          cargo = pathlib.Path("easytier-src/easytier/Cargo.toml").read_text()
          ver = re.search(r'^version\s*=\s*"([^"]+)"', cargo, re.M).group(1)
          pathlib.Path("feed/version.mk").write_text(
              "# auto-generated by EasyTier .github/workflows/openwrt.yml, do not edit\n"
              f"EASYTIER_VERSION={ver}\n"
          )
          print(f"EASYTIER_VERSION={ver}")

          # easytier 包默认从 GitHub Release 下载旧二进制, 改成用本地现编译的.
          # 注意: 必须在解析期把 feed 目录固定下来, 不能在 define 体内用
          # $(lastword $(MAKEFILE_LIST)), 否则展开时 MAKEFILE_LIST 已经变了.
          mk = pathlib.Path("feed/easytier/Makefile")
          text = mk.read_text()
          old_start = text.index("define Build/Prepare")
          old_end = text.index("endef", old_start) + len("endef")
          new_block = (
              "EASYTIER_FEED_DIR:=$(dir $(lastword $(MAKEFILE_LIST)))\n"
              "define Build/Prepare\n"
              "\tmkdir -p $(PKG_BUILD_DIR)\n"
              "\t$(CP) $(EASYTIER_FEED_DIR)bins/easytier-core $(PKG_BUILD_DIR)/\n"
              "\t$(CP) $(EASYTIER_FEED_DIR)bins/easytier-cli $(PKG_BUILD_DIR)/\n"
              "\t-$(CP) $(EASYTIER_FEED_DIR)bins/easytier-web-embed $(PKG_BUILD_DIR)/easytier-web-embed\n"
              "endef"
          )
          mk.write_text(text[:old_start] + new_block + text[old_end:])
          print("patched feed/easytier/Makefile")
          EOF
          ls -l feed/easytier/bins/
          cat feed/version.mk
          grep -A8 'Build/Prepare' feed/easytier/Makefile

      - name: Prepare output dir (SDK action 会 chown 该目录, 不存在会直接失败)
        run: mkdir -p "${{ github.workspace }}/out-${{ matrix.pkgtype }}"

      - name: Build OpenWrt packages (${{ matrix.pkgtype }})
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-${{ matrix.sdk }}
          FEEDNAME: easytier_feed
          FEED_DIR: ${{ github.workspace }}/feed
          ARTIFACTS_DIR: ${{ github.workspace }}/out-${{ matrix.pkgtype }}
          PACKAGES: easytier luci-app-easytier
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          V: s

      - name: Collect packages
        run: |
          set -e
          mkdir -p dist
          find out-${{ matrix.pkgtype }}/bin -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} dist/ \;
          ls -l dist/
          # 只要 easytier 主包 + luci 界面包 + 中文语言包
          # (中文包是 luci-app-easytier 编译时自动带出的子包, 无需加到 PACKAGES 里)
          test -n "$(ls dist/easytier_*.${{ matrix.pkgtype }} 2>/dev/null)" || { echo "missing easytier .${{ matrix.pkgtype }}"; exit 1; }
          test -n "$(ls dist/luci-app-easytier_*.${{ matrix.pkgtype }} 2>/dev/null)" || { echo "missing luci-app-easytier .${{ matrix.pkgtype }}"; exit 1; }
          test -n "$(ls dist/luci-i18n-easytier-zh-cn_*.${{ matrix.pkgtype }} 2>/dev/null)" || { echo "missing luci-i18n-easytier-zh-cn .${{ matrix.pkgtype }}"; exit 1; }

      - name: Archive packages
        uses: actions/upload-artifact@v5
        with:
          name: ET-openwrt-x86_64-${{ matrix.pkgtype }}
          path: dist/*

  openwrt-result:
    runs-on: ubuntu-latest
    needs: [ pre_job, build-bins, build-openwrt ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
