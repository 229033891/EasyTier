name: ET OpenWrt

# 生成 OpenWrt x86_64 包 (只要这 3 个), 仅支持 OpenWrt 25.12+ (apk 包管理器):
#   OpenWrt 25.12+ (apk): easytier-<ver>.apk + luci-app-easytier-<ver>.apk
#                         + luci-i18n-easytier-zh-cn-<ver>.apk (中文语言包)
#     apk add --allow-untrusted /tmp/easytier-*.apk /tmp/luci-app-easytier-*.apk /tmp/luci-i18n-easytier-zh-cn-*.apk
#
# 不再生成 OpenWrt <= 24.10 的 opkg/ipk 包 (2026-10-08 拍板; 25.12 起 apk 取代 opkg).
#
# 注意: OpenWrt 的 .apk 和 Android 的 easytier-gui.apk 不是同一个东西, 不要混淆.
# LuCI 界面源码来自 https://github.com/229033891/luci-app-easytier（官方 fork）,
# easytier 主包里的二进制是本仓库现编译的 (core + cli + web-embed), 不是从旧 Release 下载的.

on:
  workflow_dispatch:
  push:
    # 仅 releases/** 自动构建；main/dev 推送不触发
    branches: ["releases/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      RELEVANT_PATHS: >-
        ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**",
        "easytier/**", "easytier-core/**", "easytier-proto/**",
        "easytier-rpc-build/**", "easytier-web/**",
        ".github/workflows/openwrt.yml", ".github/actions/**"]
    outputs:
      # Path-based skip was removed for push: a green run with zero artifacts
      # looked like an empty package. Keep concurrent/identical-duplicate skip;
      # PR still path-filters.
      should_skip: >-
        ${{
          steps.skip_check.outputs.should_skip == 'true' ||
          (
            github.event_name == 'pull_request' &&
            steps.path_filter.outputs.relevant != 'true'
          )
        }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          cancel_others: 'true'
          # Do NOT pass `paths` on push packaging (see linux.yml).

      - id: path_filter
        if: >-
          github.event_name == 'pull_request' &&
          steps.skip_check.outputs.should_skip != 'true'
        uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        with:
          filters: |
            relevant: ${{ env.RELEVANT_PATHS }}

  build-bins:
    # 先编译 x86_64 musl 静态二进制, 供 easytier apk 打包用.
    # 包含 easytier-core + easytier-cli (+ easytier-web-embed, LuCI 自建控制台用).
    runs-on: ubuntu-24.04
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: x86_64-unknown-linux-musl
          gui: false
          pnpm: true
          pnpm-build-filter: './easytier-web/*'
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ""
          shared-key: "core-registry"
          cache-targets: "false"

      - name: Build
        run: |
          TARGET=x86_64-unknown-linux-musl
          cargo build --release --target $TARGET --package=easytier-web --features=embed
          mv ./target/$TARGET/release/easytier-web ./target/$TARGET/release/easytier-web-embed
          cargo build --release --target $TARGET --package=easytier --features=jemalloc

      - name: Cache UPX
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/upx-4.2.4
          key: upx-4.2.4-${{ runner.os }}-${{ runner.arch }}

      - name: Compress
        env:
          UPX_VERSION: '4.2.4'
          UPX_INSTALL_DIR: ${{ runner.temp }}/upx-4.2.4
        run: |
          mkdir -p bins
          # install-upx.sh runs in a subshell; use UPX_INSTALL_DIR for this step
          bash script/install-upx.sh
          UPX_BIN="${UPX_INSTALL_DIR}/upx"
          for BIN in ./target/x86_64-unknown-linux-musl/release/easytier-{core,cli,web-embed}; do
            if [[ -f "$BIN" ]]; then
              if [[ -x "$UPX_BIN" ]]; then
                # Default UPX level (was --lzma --best); compare artifact size on next run.
                "$UPX_BIN" "$BIN" || true
              fi
              cp "$BIN" bins/
            fi
          done
          ls -l bins/

      - name: Archive bins
        uses: actions/upload-artifact@v7
        with:
          name: ET-openwrt-bins
          path: bins/*

  build-openwrt:
    # 用 OpenWrt SDK 打包, 只出 apk: OpenWrt 25.12 起 apk 取代 opkg, <=24.10 的 ipk 已不再产出.
    # SDK 镜像 tag 对应关系见 https://github.com/openwrt/docker/pkgs/container/sdk,
    # 换版本时改下面的 sdk 即可. 必须带补丁号: x86_64-25.12.5 存在, x86_64-25.12 不存在(404).
    # 保留 matrix 结构 (当前只有一行), 方便以后要加回别的 pkgtype/sdk 时改动最小.
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkgtype: apk
            sdk: "25.12.5"
    runs-on: ubuntu-latest
    needs: [pre_job, build-bins]
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - name: Checkout EasyTier (取版本号)
        uses: actions/checkout@v5
        with:
          path: easytier-src

      - name: Checkout luci-app-easytier (打包 feed)
        uses: actions/checkout@v5
        with:
          repository: 229033891/luci-app-easytier
          ref: main
          path: feed

      - name: Download bins
        uses: actions/download-artifact@v8
        with:
          name: ET-openwrt-bins
          path: feed/easytier/bins/

      - name: Prepare feed (版本号 + 本地二进制)
        run: |
          python3 - <<'EOF'
          import re, pathlib
          cargo = pathlib.Path("easytier-src/easytier/Cargo.toml").read_text()
          ver = re.search(r'^version\s*=\s*"([^"]+)"', cargo, re.M).group(1)
          pathlib.Path("feed/version.mk").write_text(
              "# auto-generated by EasyTier .github/workflows/openwrt.yml, do not edit\n"
              f"EASYTIER_VERSION={ver}\n"
          )
          print(f"EASYTIER_VERSION={ver}")

          # Feed Makefiles use:
          #   -include $(dir $(lastword $(MAKEFILE_LIST)))../version.mk
          #   PKG_VERSION:=$(or $(EASYTIER_VERSION),2.6.4)
          # Inside openwrt/gh-action-sdk, MAKEFILE_LIST no longer points at the
          # package Makefile when those lines expand, so the relative include
          # misses and PKG_VERSION silently falls back to 2.6.4 (package name /
          # opkg Version disagree with the freshly built 2.7.x binary).
          # Pin absolute include + concrete PKG_VERSION under /feed mount.
          for mk in pathlib.Path("feed").rglob("Makefile"):
              text = mk.read_text()
              orig = text
              text = re.sub(
                  r"^-include\s+\$\(dir\s+\$\(lastword\s+\$\(MAKEFILE_LIST\)\)\)\.\./version\.mk\s*$",
                  "-include /feed/version.mk",
                  text,
                  flags=re.M,
              )
              text = re.sub(
                  r"^PKG_VERSION:=\$\(or\s+\$\(EASYTIER_VERSION\),[^)]+\)\s*$",
                  f"PKG_VERSION:={ver}",
                  text,
                  flags=re.M,
              )
              if text != orig:
                  mk.write_text(text)
                  print(f"patched version pins in {mk.as_posix()}")

          pinned = list(pathlib.Path("feed").rglob("Makefile"))
          if not any(f"PKG_VERSION:={ver}" in p.read_text() for p in pinned):
              raise SystemExit(
                  f"failed to pin PKG_VERSION:={ver} in feed Makefiles; "
                  "refusing to build with stale fallback version"
              )

          # luci.mk versions luci-i18n-* via PKG_PO_VERSION (default: findrev
          # date-hash like 26.268.42210~79b2b01), independent of PKG_VERSION.
          # Pin it before include luci.mk so zh-cn artifacts match the release
          # (filename + package Version metadata), and Collect can keep the
          # strict version guard.
          luci_mk = pathlib.Path("feed/luci-app-easytier/Makefile")
          luci_text = luci_mk.read_text()
          if re.search(r"^PKG_PO_VERSION\s*:=", luci_text, re.M):
              luci_text2 = re.sub(
                  r"^PKG_PO_VERSION\s*:=.*$",
                  f"PKG_PO_VERSION:={ver}",
                  luci_text,
                  flags=re.M,
              )
          else:
              luci_text2 = re.sub(
                  r"^(PKG_VERSION:=.+)$",
                  rf"\1\nPKG_PO_VERSION:={ver}",
                  luci_text,
                  count=1,
                  flags=re.M,
              )
          if f"PKG_PO_VERSION:={ver}" not in luci_text2:
              raise SystemExit(
                  f"failed to pin PKG_PO_VERSION:={ver} in {luci_mk.as_posix()}; "
                  "refusing to build i18n with findrev date-hash version"
              )
          if luci_text2 != luci_text:
              luci_mk.write_text(luci_text2)
              print(f"pinned PKG_PO_VERSION:={ver} in {luci_mk.as_posix()}")

          # easytier 包默认从 GitHub Release 下载旧二进制, 改成用本地现编译的.
          # EASYTIER_FEED_DIR must be an absolute path under the SDK FEED_DIR mount
          # (/feed/...). Using $(dir $(lastword $(MAKEFILE_LIST))) breaks because by
          # Build/Prepare expand time the last makefile is include/package.mk.
          mk = pathlib.Path("feed/easytier/Makefile")
          text = mk.read_text()
          old_start = text.index("define Build/Prepare")
          old_end = text.index("endef", old_start) + len("endef")
          new_block = (
              # Absolute path inside the SDK container feed mount (FEED_DIR -> /feed).
              "EASYTIER_FEED_DIR:=/feed/easytier/\n"
              "define Build/Prepare\n"
              "\tmkdir -p $(PKG_BUILD_DIR)\n"
              "\t$(CP) $(EASYTIER_FEED_DIR)bins/easytier-core $(PKG_BUILD_DIR)/\n"
              "\t$(CP) $(EASYTIER_FEED_DIR)bins/easytier-cli $(PKG_BUILD_DIR)/\n"
              "\t-$(CP) $(EASYTIER_FEED_DIR)bins/easytier-web-embed $(PKG_BUILD_DIR)/easytier-web-embed\n"
              "endef"
          )
          mk.write_text(text[:old_start] + new_block + text[old_end:])
          print("patched feed/easytier/Makefile Build/Prepare")
          EOF
          ls -l feed/easytier/bins/
          cat feed/version.mk
          grep -nE '^(PKG_VERSION|PKG_PO_VERSION|-include)' feed/easytier/Makefile feed/luci-app-easytier/Makefile
          grep -A8 'Build/Prepare' feed/easytier/Makefile

      - name: Prepare output dir (SDK action 会 chown 该目录, 不存在会直接失败)
        run: mkdir -p "${{ github.workspace }}/out-${{ matrix.pkgtype }}"

      - name: Build OpenWrt packages (${{ matrix.pkgtype }})
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-${{ matrix.sdk }}
          FEEDNAME: easytier_feed
          FEED_DIR: ${{ github.workspace }}/feed
          ARTIFACTS_DIR: ${{ github.workspace }}/out-${{ matrix.pkgtype }}
          PACKAGES: easytier luci-app-easytier
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          V: s

      - name: Collect packages
        run: |
          set -e
          mkdir -p dist
          find out-${{ matrix.pkgtype }}/bin -type f -name '*.apk' -exec cp {} dist/ \;
          ls -l dist/
          # apk 用连字符 (easytier-1.2.3.apk / luci-app-easytier-1.2.3-r1.apk)
          pkg="${{ matrix.pkgtype }}"
          ver="$(python3 - <<'PY'
          import re, pathlib
          cargo = pathlib.Path("easytier-src/easytier/Cargo.toml").read_text()
          print(re.search(r'^version\s*=\s*"([^"]+)"', cargo, re.M).group(1))
          PY
          )"
          shopt -s nullglob
          easytier=(dist/easytier-*.${pkg})
          luci=(dist/luci-app-easytier-*.${pkg})
          i18n=(dist/luci-i18n-easytier-zh-cn-*.${pkg})
          # 只要 easytier 主包 + luci 界面包 + 中文语言包
          # (中文包是 luci-app-easytier 编译时自动带出的子包, 无需加到 PACKAGES 里)
          (( ${#easytier[@]} > 0 )) || { echo "missing easytier .${pkg}"; ls -l dist/; exit 1; }
          (( ${#luci[@]} > 0 )) || { echo "missing luci-app-easytier .${pkg}"; ls -l dist/; exit 1; }
          (( ${#i18n[@]} > 0 )) || { echo "missing luci-i18n-easytier-zh-cn .${pkg}"; ls -l dist/; exit 1; }
          # Guard against MAKEFILE_LIST include bug (stale 2.6.4) and unpinned
          # PKG_PO_VERSION (luci-i18n date-hash). Boundary-aware match (avoid
          # bare *${ver}* matching 2.7.40):
          #   easytier-2.7.4.apk / luci-app-easytier-2.7.4-r1.apk
          #   luci-i18n-easytier-zh-cn-2.7.4.apk
          for f in "${easytier[@]}" "${luci[@]}" "${i18n[@]}"; do
            base="$(basename "$f")"
            if [[ "$base" != *"-${ver}.apk" && "$base" != *"-${ver}-"* ]]; then
              echo "package version mismatch: expected ${ver} in ${base}"
              ls -l dist/
              exit 1
            fi
          done
          echo "openwrt package version ok: ${ver}"

      - name: Archive packages
        uses: actions/upload-artifact@v7
        with:
          name: ET-openwrt-x86_64-${{ matrix.pkgtype }}
          path: dist/*

  openwrt-result:
    runs-on: ubuntu-latest
    needs: [ pre_job, build-bins, build-openwrt ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
