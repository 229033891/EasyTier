name: ET Linux

on:
  workflow_dispatch:
  push:
    # 仅 releases/** 自动构建；main/dev 推送不触发
    branches: [ "releases/**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      RELEVANT_PATHS: >-
        ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**",
        "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "easytier/**",
        "easytier-core/**", "easytier-proto/**", "easytier-rpc-build/**",
        "easytier-web/**", ".github/workflows/linux.yml",
        ".github/actions/**"]
    outputs:
      # Release builds must run even if they only change release metadata.
      should_skip: >-
        ${{
          (
            steps.skip_check.outputs.should_skip == 'true' ||
            (
              github.event_name == 'pull_request' &&
              steps.path_filter.outputs.relevant != 'true'
            )
          ) &&
          !startsWith(github.ref_name, 'releases/')
        }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf # v5.3.1
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          cancel_others: 'true'
          paths: ${{ env.RELEVANT_PATHS }}

      - id: path_filter
        if: >-
          github.event_name == 'pull_request' &&
          steps.skip_check.outputs.should_skip != 'true'
        uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        with:
          filters: |
            relevant: ${{ env.RELEVANT_PATHS }}
  build_web:
    # 前端控制台打进 easytier-web-embed 用, 顺带跑前端测试
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Frontend Environment
        uses: ./.github/actions/prepare-pnpm
        with:
          token: ${{ github.token }}
          build-filter: './easytier-web/*'

      - name: Test frontend-lib
        run: pnpm --filter easytier-frontend-lib test:config-ui

      - name: Archive artifact
        uses: actions/upload-artifact@v5
        with:
          name: ET-web-dashboard
          path: |
            easytier-web/frontend/dist/*
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux 无头服务器 (x86_64): easytier-core + easytier-cli
          - TARGET: x86_64-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-x86_64

    runs-on: ${{ matrix.OS }}
    env:
      NAME: easytier
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
      OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
    needs:
      - pre_job
      - build_web
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - name: Download web artifact
        uses: actions/download-artifact@v5
        with:
          name: ET-web-dashboard
          path: easytier-web/frontend/dist/

      # Frontend/wasm already built in build_web and downloaded above.
      # Skip pnpm here to avoid a second (multi-minute) rebuild.
      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          # The prefix cache key, this can be changed to start a new cache manually.
          # default: "v0-rust"
          prefix-key: ""
          shared-key: "core-registry"
          cache-targets: "false"

      - name: Verify web embed frontend dist
        run: |
          set -euo pipefail
          test -f easytier-web/frontend/dist/index.html

      - name: Build
        run: |
          set -euo pipefail
          # One cargo invocation shares dependency compilation between packages.
          # Linux 无头包: ET-core + ET-cli + ET-web-embed (自建控制台)
          cargo build --release --target "$TARGET" \
            -p easytier-web \
            -p easytier \
            --features easytier-web/embed,easytier/jemalloc
          mv ./target/$TARGET/release/easytier-web ./target/$TARGET/release/easytier-web-embed

      - name: Cache UPX
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/upx-4.2.4
          key: upx-4.2.4-${{ runner.os }}-${{ runner.arch }}

      - name: Compress
        env:
          UPX_VERSION: '4.2.4'
          UPX_INSTALL_DIR: ${{ runner.temp }}/upx-4.2.4
        run: |
          mkdir -p ./artifacts/objects/
          SUFFIX=""

          # install-upx.sh runs in a subshell; use UPX_INSTALL_DIR for this step
          bash script/install-upx.sh
          UPX_BIN="${UPX_INSTALL_DIR}/upx"

          # Cargo 产物仍是 easytier-*；发布文件统一为 ET-* 前缀
          declare -A RENAME=(
            [easytier-core]=ET-core
            [easytier-cli]=ET-cli
            [easytier-web-embed]=ET-web-embed
          )
          for SRC in easytier-core easytier-cli easytier-web-embed; do
            BIN="./target/$TARGET/release/${SRC}${SUFFIX}"
            if [[ -f "$BIN" ]]; then
              if [[ -x "$UPX_BIN" ]]; then
                "$UPX_BIN" --lzma --best "$BIN" || true
              fi
              mv "$BIN" "./artifacts/objects/${RENAME[$SRC]}${SUFFIX}"
            fi
          done

          mv ./artifacts/objects/* ./artifacts/
          rm -rf ./artifacts/objects/

      - name: Archive artifact
        uses: actions/upload-artifact@v5
        with:
          name: ET-${{ matrix.ARTIFACT_NAME }}
          path: |
            ./artifacts/*

  core-result:
    runs-on: ubuntu-latest
    needs: [ pre_job, build_web, build ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
