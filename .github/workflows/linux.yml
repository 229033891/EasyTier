name: ET Linux

on:
  workflow_dispatch:
  push:
    # 仅 releases/** 自动构建；main/dev 推送不触发
    branches: [ "releases/**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # necessary for windows
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      RELEVANT_PATHS: >-
        ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**",
        "pnpm-lock.yaml", "pnpm-workspace.yaml", "package.json", "easytier/**",
        "easytier-core/**", "easytier-proto/**", "easytier-rpc-build/**",
        "easytier-web/**", "easytier-gui/**", "easytier-frontend-lib/**",
        "tauri-plugin-vpnservice/**", ".github/workflows/linux.yml",
        ".github/actions/**"]
    outputs:
      # Path-based skip was removed for push: a green run with zero artifacts
      # looked like an "empty package" and ET Release could pick it as success.
      # Keep concurrent/identical-duplicate skip only; PR still path-filters.
      should_skip: >-
        ${{
          steps.skip_check.outputs.should_skip == 'true' ||
          (
            github.event_name == 'pull_request' &&
            steps.path_filter.outputs.relevant != 'true'
          )
        }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          cancel_others: 'true'
          # Do NOT pass `paths` on push packaging: unrelated-path skips still
          # conclude success with no ET-* artifacts.

      - id: path_filter
        if: >-
          github.event_name == 'pull_request' &&
          steps.skip_check.outputs.should_skip != 'true'
        uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        with:
          filters: |
            relevant: ${{ env.RELEVANT_PATHS }}
  build_web:
    # 前端 dist → 单独的 ET-web-embed 包（build-web-embed），不进无头节点包
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Frontend Environment
        uses: ./.github/actions/prepare-pnpm
        with:
          token: ${{ github.token }}
          build-filter: './easytier-web/*'

      - name: Test frontend-lib
        run: pnpm --filter easytier-frontend-lib test:config-ui

      - name: Archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: ET-web-dashboard
          path: |
            easytier-web/frontend/dist/*
  # Headless node: ET-core + ET-cli only (no web console). Parallel with build_web / build-web-embed.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-x86_64

    runs-on: ${{ matrix.OS }}
    env:
      NAME: easytier
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
      OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ""
          shared-key: "core-registry"
          cache-targets: "false"

      - name: Build headless (core + cli)
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET" \
            -p easytier \
            --features easytier/jemalloc

      - name: Cache UPX
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/upx-4.2.4
          key: upx-4.2.4-${{ runner.os }}-${{ runner.arch }}

      - name: Compress and collect
        env:
          UPX_VERSION: '4.2.4'
          UPX_INSTALL_DIR: ${{ runner.temp }}/upx-4.2.4
        run: |
          mkdir -p ./artifacts/objects/
          SUFFIX=""
          bash script/install-upx.sh
          UPX_BIN="${UPX_INSTALL_DIR}/upx"

          declare -A RENAME=(
            [easytier-core]=ET-core
            [easytier-cli]=ET-cli
          )
          for SRC in easytier-core easytier-cli; do
            BIN="./target/$TARGET/release/${SRC}${SUFFIX}"
            if [[ ! -f "$BIN" ]]; then
              echo "::error::missing build output: ${BIN}"
              exit 1
            fi
            if [[ -x "$UPX_BIN" ]]; then
              "$UPX_BIN" "$BIN" || true
            fi
            mv "$BIN" "./artifacts/objects/${RENAME[$SRC]}${SUFFIX}"
          done

          shopt -s nullglob
          built=(./artifacts/objects/*)
          if [[ ${#built[@]} -eq 0 ]]; then
            echo "::error::Linux package directory is empty"
            exit 1
          fi
          mv ./artifacts/objects/* ./artifacts/
          rm -rf ./artifacts/objects/

      - name: Archive headless artifact
        uses: actions/upload-artifact@v7
        with:
          name: ET-${{ matrix.ARTIFACT_NAME }}
          path: |
            ./artifacts/*

  # Web console product: ET-web-embed only
  build-web-embed:
    strategy:
      fail-fast: true
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-x86_64

    runs-on: ${{ matrix.OS }}
    env:
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
    needs:
      - pre_job
      - build_web
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Download web dashboard dist
        uses: actions/download-artifact@v8
        with:
          name: ET-web-dashboard
          path: easytier-web/frontend/dist/

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ""
          shared-key: "web-embed-linux-registry"
          cache-targets: "false"

      - name: Verify web embed frontend dist
        run: |
          set -euo pipefail
          test -f easytier-web/frontend/dist/index.html

      - name: Build ET-web-embed
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET" \
            -p easytier-web \
            --features easytier-web/embed
          mv ./target/$TARGET/release/easytier-web ./target/$TARGET/release/easytier-web-embed

      - name: Cache UPX
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/upx-4.2.4
          key: upx-4.2.4-${{ runner.os }}-${{ runner.arch }}

      - name: Compress and collect web console
        env:
          UPX_VERSION: '4.2.4'
          UPX_INSTALL_DIR: ${{ runner.temp }}/upx-4.2.4
        run: |
          set -euo pipefail
          mkdir -p ./webconsole
          BIN="./target/$TARGET/release/easytier-web-embed"
          test -f "$BIN"
          bash script/install-upx.sh
          UPX_BIN="${UPX_INSTALL_DIR}/upx"
          if [[ -x "$UPX_BIN" ]]; then
            "$UPX_BIN" "$BIN" || true
          fi
          mv "$BIN" ./webconsole/ET-web-embed
          ls -la ./webconsole/

      - name: Archive web console artifact
        uses: actions/upload-artifact@v7
        with:
          name: ET-web-${{ matrix.ARTIFACT_NAME }}
          path: |
            ./webconsole/*

  # Desktop GUI: .deb (ET + ET-cli sidecar). Parallel with headless / web-embed.
  # Uses glibc (gnu), not musl — WebKitGTK / Tauri desktop needs it.
  build-gui:
    strategy:
      fail-fast: true
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-gnu
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-x86_64

    runs-on: ${{ matrix.OS }}
    env:
      TARGET: ${{ matrix.TARGET }}
      GUI_TARGET: ${{ matrix.TARGET }}
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: true
          pnpm: true
          pnpm-build-filter: 'easytier-gui...'
          pnpm-setup-wasm: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ""
          shared-key: "gui-linux-registry"
          cache-targets: "false"

      # prepare-build already ran `pnpm --filter easytier-gui... build`.
      # Skip beforeBuildCommand; ship .deb only (rpm/AppImage optional later).
      - name: Verify GUI frontend dist
        run: |
          set -euo pipefail
          test -f easytier-gui/dist/index.html
          printf '%s\n' '{"build":{"beforeBuildCommand":""},"bundle":{"targets":["deb"]}}' \
            > easytier-gui/tauri.ci.conf.json

      - name: Stage ET-cli sidecar for GUI bundle
        run: |
          set -euo pipefail
          cargo build --release --target "$GUI_TARGET" -p easytier --bin easytier-cli
          mkdir -p easytier-gui/src-tauri/binaries
          TARGET_ROOT="${CARGO_TARGET_DIR:-./target}"
          src="$TARGET_ROOT/$GUI_TARGET/release/easytier-cli"
          dst="easytier-gui/src-tauri/binaries/ET-cli-${GUI_TARGET}"
          test -f "$src"
          cp -f "$src" "$dst"
          chmod +x "$dst"
          ls -la "$dst"

      - name: Build GUI
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: ./easytier-gui
          args: --verbose --target ${{ matrix.TARGET }} --config tauri.ci.conf.json

      - name: Collect GUI artifact
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          shopt -s nullglob
          debs=(./target/$GUI_TARGET/release/bundle/deb/*.deb)
          if (( ${#debs[@]} == 0 )); then
            echo "::error::No Linux .deb under ./target/$GUI_TARGET/release/bundle/deb/"
            ls -laR "./target/$GUI_TARGET/release/bundle" || true
            exit 1
          fi
          mv "${debs[@]}" ./artifacts/
          ls -la ./artifacts/

      - name: Archive GUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ET-gui-${{ matrix.ARTIFACT_NAME }}
          path: |
            ./artifacts/*

  core-result:
    runs-on: ubuntu-latest
    needs: [ pre_job, build_web, build, build-web-embed, build-gui ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
