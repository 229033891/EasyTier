name: 'Setup pnpm'
author: Luna
description: 'Setup Node.js, pnpm, and install dependencies'

inputs:
  token:
    description: 'GitHub token (optional; reserved for future authenticated downloads)'
    required: false
  build-filter:
    description: 'The filter argument for pnpm build (e.g. ./easytier-web/*)'
    required: false
    default: ''
  setup-protoc:
    description: 'Install protoc (set false when caller already installed it)'
    required: false
    default: 'true'
  setup-wasm:
    description: 'Install wasm rust target and wasm-pack (needed for config-generator)'
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      if: ${{ inputs.setup-wasm == 'true' }}
      with:
        toolchain: 1.95
        target: wasm32-unknown-unknown
        cache: false
        rustflags: ''

    - uses: taiki-e/install-action@v2
      if: ${{ inputs.setup-wasm == 'true' }}
      with:
        tool: wasm-pack

    - name: Cache protoc
      if: ${{ inputs.setup-protoc == 'true' }}
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/protoc-35.1
        key: protoc-35.1-${{ runner.os }}-${{ runner.arch }}

    - name: Setup protoc
      if: ${{ inputs.setup-protoc == 'true' }}
      run: bash script/install-protoc.sh
      shell: bash
      env:
        PROTOC_VERSION: '35.1'
        PROTOC_INSTALL_DIR: ${{ runner.temp }}/protoc-35.1

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22

    - name: Install pnpm
      uses: pnpm/action-setup@v5
      with:
        version: 10
        run_install: false

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v5
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install and build
      shell: bash
      env:
        # Evaluated by GHA; bash below only unsets when true.
        ET_DISABLE_RUSTC_WRAPPER_FOR_WASM: ${{ runner.os == 'Windows' && inputs.setup-wasm == 'true' }}
      run: |
        set -euo pipefail

        # Windows + wasm (config-generator / wasm-pack → cargo → rustc web-sys):
        # sccache wrapping rustc fails with "failed to spawn" / exit 0xfffffffe.
        # Root cause: CreateProcess command-line length limits when web-sys is
        # compiled with a huge --cfg feature=* set; sccache re-spawns rustc
        # with that full argv and hits the OS ceiling. Native MSVC/GUI builds
        # keep RUSTC_WRAPPER=sccache (set by prepare-build); only this
        # wasm-oriented pnpm build clears it for the duration of the step.
        # Linux/macOS wasm builds are unaffected (different process model).
        # Scope: step env only — later workflow steps still inherit sccache.
        if [[ "${ET_DISABLE_RUSTC_WRAPPER_FOR_WASM}" == "true" ]]; then
          if [[ -n "${RUSTC_WRAPPER:-}" ]]; then
            echo "Disabling RUSTC_WRAPPER=${RUSTC_WRAPPER} for Windows wasm pnpm build (sccache CreateProcess limit)"
          else
            echo "Windows wasm pnpm build: RUSTC_WRAPPER already unset"
          fi
          unset RUSTC_WRAPPER
        fi

        pnpm -r install
        if [ -n "${{ inputs.build-filter }}" ]; then
          echo "Building with filter: ${{ inputs.build-filter }}"
          pnpm -r --workspace-concurrency=1 --filter "${{ inputs.build-filter }}" build
        else
          echo "No build filter provided, building all packages"
          pnpm -r --workspace-concurrency=1 build
        fi

    - name: Bundle config generator with web frontend
      shell: bash
      run: |
        if [ -f easytier-web/frontend/dist/index.html ] && [ -f easytier-web/config-generator/dist/index.html ]; then
          mkdir -p easytier-web/frontend/dist/config-generator
          cp -R easytier-web/config-generator/dist/. easytier-web/frontend/dist/config-generator/
        fi
