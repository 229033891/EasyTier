# ET Docker Compose（单镜像 ET-core / ET-cli / ET-web-embed）
#
# 镜像来源（任选其一，替换 <owner> / tag）：
#   ghcr.io/229033891/et:v2.7.0         # 正式 Release 对应 tag
#   ghcr.io/229033891/et:dev            # 开发验证（ET Docker 手动打）
#   ghcr.io/229033891/et:latest         # 仅 main 流水线 mark_latest 时
# 国内加速示例：m.daocloud.io/ghcr.io/229033891/et:dev
# 安装/升级总方案：docs/roadmap/github-release-install.md
#
# 从旧版 easytier/easytier:latest 迁移注意：
#   1. 镜像名改为 ghcr.io/<owner>/et:<tag>（产物前缀 ET-*，ENTRYPOINT 已是 ET-core）
#   2. 守护进程参数为 --daemon（不是 -d）
#   3. --config-server 与 -w 等价；--secure-mode 仍可用
#   4. 若挂载配置目录，需显式 --config-dir /config
#
# 控制台：docker compose up -d console
# 节点：  编辑 node 环境变量后 docker compose --profile node up -d node

services:
  console:
    image: ghcr.io/229033891/et:dev
    container_name: et-console
    restart: unless-stopped
    # 镜像默认 ENTRYPOINT 为 ET-core；控制台需改为 ET-web-embed
    entrypoint: ["/sbin/tini", "--"]
    command:
      - ET-web-embed
      - --db=/app/data/et.db
      - --config-server-port=22020
      - --config-server-protocol=udp,tcp
      # embed 模式下 API + 静态页同端口（勿写 easytier-web-embed，Linux 下大小写敏感）
      - --api-server-port=8080
    ports:
      - "22020:22020/udp"
      - "22020:22020/tcp"
      - "8080:8080"
    volumes:
      - ./et-console-data:/app/data

  node:
    image: ghcr.io/229033891/et:dev
    container_name: et-node
    profiles: ["node"]
    restart: unless-stopped
    hostname: FNNAS
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: Asia/Shanghai
      # 按需修改（也可直接改 command）
      ET_CONFIG_SERVER: udp://et.scmec.vip:22020/admin
      ET_SECURE_MODE: "true"
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - /vol1/1000/docker/easytier/config:/config
    # ENTRYPOINT: /sbin/tini -- ET-core
    command:
      - --daemon
      - --config-dir
      - /config
      - --config-server
      - udp://et.scmec.vip:22020/admin
      - --secure-mode
