syntax = "proto3";

import "common.proto";
import "peer_rpc.proto";
import "api_instance.proto";
import "acl.proto";

package api.manage;

enum NetworkingMethod {
  PublicServer = 0;
  Manual = 1;
  Standalone = 2;
}

enum ConfigSource {
  ConfigSourceUnspecified = 0;
  ConfigSourceUser = 1;
  ConfigSourceWeb = 2;
}

message NetworkConfig {
  optional string instance_id = 1;

  optional bool dhcp = 2;
  optional string virtual_ipv4 = 3;
  optional int32 network_length = 4;
  optional string hostname = 5;
  optional string network_name = 6;
  optional string network_secret = 7;
  optional NetworkingMethod networking_method = 8;

  optional string public_server_url = 9;
  repeated string peer_urls = 10;

  repeated string proxy_cidrs = 11;

  optional bool enable_vpn_portal = 12 [deprecated = true];
  optional int32 vpn_portal_listen_port = 13 [deprecated = true];
  optional string vpn_portal_client_network_addr = 14 [deprecated = true];
  optional int32 vpn_portal_client_network_len = 15 [deprecated = true];

  optional bool advanced_settings = 16;

  repeated string listener_urls = 17;
  // optional int32 rpc_port = 18;
  optional bool latency_first = 19;

  optional string dev_name = 20;

  optional bool use_smoltcp = 21;
  optional bool disable_ipv6 = 47;
  optional bool enable_kcp_proxy = 22;
  optional bool disable_kcp_input = 23;
  optional bool disable_p2p = 24;
  optional bool bind_device = 25;
  optional bool no_tun = 26;

  optional bool enable_exit_node = 27;
  optional bool relay_all_peer_rpc = 28;
  optional bool multi_thread = 29;
  optional bool enable_relay_network_whitelist = 30;
  repeated string relay_network_whitelist = 31;
  optional bool enable_manual_routes = 32;
  repeated string routes = 33;
  repeated string exit_nodes = 34;
  optional bool proxy_forward_by_system = 35;
  optional bool disable_encryption = 36;
  optional bool enable_socks5 = 37;
  optional int32 socks5_port = 38;
  optional bool disable_udp_hole_punching = 39;
  optional int32 mtu = 40;
  repeated string mapped_listeners = 41;

  optional bool enable_magic_dns = 42;
  optional bool enable_private_mode = 43;

  // repeated string rpc_portal_whitelists = 44;

  optional bool enable_quic_proxy = 45;
  optional bool disable_quic_input = 46;
  optional int32 quic_listen_port = 50 [deprecated = true];
  repeated PortForwardConfig port_forwards = 48;

  optional bool disable_sym_hole_punching = 49;

  optional bool p2p_only = 51;
  optional common.CompressionAlgoPb data_compress_algo = 52;
  optional string encryption_algorithm = 53;
  optional bool disable_tcp_hole_punching = 54;

  common.SecureModeConfig secure_mode = 55;
  optional acl.Acl acl = 56;
  optional string credential_file = 57;
  optional bool lazy_p2p = 58;
  optional bool need_p2p = 59;
  optional uint64 instance_recv_bps_limit = 60;
  optional bool disable_upnp = 61;
  optional bool ipv6_public_addr_provider = 62;
  optional bool ipv6_public_addr_auto = 63;
  optional string ipv6_public_addr_prefix = 64;
  optional bool disable_relay_data = 65;
  optional bool enable_udp_broadcast_relay = 66;
  optional uint32 socket_mark = 67;
  repeated NetworkPeerConfig peers = 68;
  optional VpnPortalConfig vpn_portal_config = 69;
  repeated ManagedCredentialConfig managed_credentials = 71;
  optional bool prefer_peer_relay = 72;
  // Opt-in: install peer-advertised 0.0.0.0/0 without a local exit (see Flags).
  optional bool allow_peer_default_without_exit = 73;
  // DNS policy: static hosts / split forwarders / upstream (see docs/roadmap/dns-policy.md).
  // Older clients ignore this field; behavior degrades to pre-policy MagicDNS.
  optional DnsConfig dns_config = 74;
  // Prefer this underlay scheme order when establishing a direct peer connection
  // (e.g. "udp", "tcp", "wss"). Default is "udp,tcp".
  optional string default_protocol = 75;
  // Consecutive ping failures before closing a PeerConn (default 5).
  optional uint32 ping_fail_close_count = 76;
  // Adaptive ping max interval in seconds (factory default 10 since 2026-10, was 32; TCP hole-punch may still cap to 1).
  optional uint32 ping_interval_max_sec = 77;
  // Tip-only ConnectionPathTier (removed); never reuse.
  reserved 78;
  // PeerConn quality select weights/thresholds (P1.7). See FlagsInConfig; 0 / unset = default.
  optional uint32 conn_select_w_lat = 79;
  optional uint32 conn_select_w_loss = 80;
  optional uint32 conn_select_w_jitter = 81;
  optional uint32 conn_select_loss_fuse_pct = 82;
  optional uint32 conn_select_switch_margin_pct = 83;
  optional uint32 conn_select_switch_abs_margin_milli = 84;
  optional uint32 conn_select_switch_windows = 85;
  // PeerConn bonding (Phase 2a). Unset / 0 on FlagsInConfig defaults → bond_count=1, replica_fill_max=5.
  optional uint32 peer_link_bond_count = 86;
  optional uint32 peer_link_replica_fill_max = 87;

  // Unified routing model: `[[policy_routes]]` (see docs/roadmap/unified-routing-design.md).
  // Older clients ignore this field; behavior degrades to the pre-policy path.
  repeated PolicyRouteConfig policy_routes = 88;
  // Only meaningful together with `manual_routes` / `routes`: when true the manual
  // list is *appended* to the auto-computed set instead of replacing it.
  optional bool manual_routes_append = 89;
  // Presence bit for `policy_routes`: proto3 repeated fields have no presence, so
  // an empty list is indistinguishable from "field omitted". When this is true,
  // `policy_routes` is authoritative — including the empty list (clear all).
  // Older clients leave it unset; empty `policy_routes` then does not wipe the
  // existing table.
  optional bool has_policy_routes = 90;
}

// One `[[policy_routes]]` entry: a CIDR and/or domain match, plus the candidate
// gateway peers and the selection policy. String fields keep the wire format
// identical to the TOML key so validation errors surface on the same values.
message PolicyRouteConfig {
  // e.g. "10.0.0.0/24". At least one of `cidr` / `domains` must be set.
  optional string cidr = 1;
  // e.g. "*.atlassian.net" (wildcard parent needs >= 2 labels).
  repeated string domains = 2;
  // Candidate gateway peers (virtual IPs), in preference order.
  repeated string peers = 3;
  // "priority" | "quality" | "balance".
  optional string select_by = 4;
  // "unreachable" | "degraded" | "never".
  optional string failover_when = 5;
  // "open" (fall back to the physical gateway) | "closed" (drop).
  optional string if_all_unavailable = 6;
  // Required when `if_all_unavailable = closed` and more than one peer is set.
  optional bool require_confirmed = 7;
  // Composite-cost ceiling; required with `failover_when = degraded`.
  optional int32 quality_degraded_cost = 8;
}

message DnsHostEntry {
  string name = 1;
  repeated string ips = 2;
  // Seconds; 0 / unset = default long TTL (300s). Must not use MagicDNS route TTL (1s).
  optional uint32 ttl_secs = 3;
}

message DnsForwarder {
  repeated string domains = 1;
  repeated string servers = 2;
}

message DnsConfig {
  repeated DnsHostEntry hosts = 1;
  repeated DnsForwarder forwarders = 2;
  // Empty = keep today's system DNS forwarder behavior.
  repeated string upstream_dns = 3;
}

message ManagedCredentialConfig {
  string credential_id = 1;
  string credential_secret = 2;
  repeated string groups = 3;
  bool allow_relay = 4;
  repeated string allowed_proxy_cidrs = 5;
  int64 expiry_unix = 6;
  optional bool reusable = 7;
}

message ManagedCredentialSet {
  repeated ManagedCredentialConfig entries = 1;
}

message VpnPortalClientConfig {
  string name = 1;
  string virtual_ip = 2;
  repeated string groups = 3;
}

message VpnPortalConfig {
  string wireguard_listen = 1;
  optional string wireguard_private_key = 2;
  repeated VpnPortalClientConfig clients = 3;
}

message NetworkPeerConfig {
  string uri = 1;
  optional string peer_public_key = 2;
}

message PortForwardConfig {
  string bind_ip = 1;
  uint32 bind_port = 2;
  string dst_ip = 3;
  uint32 dst_port = 4;
  string proto = 5;
}

message MyNodeInfo {
  common.Ipv4Inet virtual_ipv4 = 1;
  string hostname = 2;
  string version = 3;
  peer_rpc.GetIpListResponse ips = 4;
  common.StunInfo stun_info = 5;
  repeated common.Url listeners = 6;
  optional string vpn_portal_cfg = 7 [deprecated = true];
  uint32 peer_id = 8;
  // Configured virtual IPv6 on this node (for Android VpnService TUN addressing).
  optional common.Ipv6Inet virtual_ipv6 = 9;
}

message NetworkInstanceRunningInfo {
  string dev_name = 1;
  MyNodeInfo my_node_info = 2;
  repeated string events = 3;
  repeated api.instance.Route routes = 4;
  repeated api.instance.PeerInfo peers = 5;
  repeated api.instance.PeerRoutePair peer_route_pairs = 6;
  bool running = 7;
  optional string error_msg = 8;
  peer_rpc.RouteForeignNetworkSummary foreign_network_summary = 9;
  // Desktop L2 sync summary: desired vs installed proxy CIDRs and last error.
  optional string proxy_cidr_route_sync = 10;
  // Tip-only fallback status fields (removed with ConnectionPathTier); never reuse.
  reserved 11, 12, 13;
  // Route policy that host-side (Android VpnService / OHOS) route aggregators
  // need but cannot read themselves. `NetworkInstanceRunningInfo` is the only
  // per-instance payload those hosts already poll, so the policy is mirrored
  // here. Proto3 scalars have no presence, which is exactly why the server must
  // send these explicitly: an omitted bool is indistinguishable from `false`.
  optional bool allow_peer_default_without_exit = 14;
  repeated string exit_nodes = 15;
  // Core-computed L2 desired proxy-CIDR set (peer routes, policy local_routes,
  // manual_routes override/append, exit /0, escape hatch; no_tun honored).
  // Host-side installers (Android VpnService / OHOS) install this verbatim
  // instead of reimplementing the semantics. Serialized with prost-serde JSON,
  // so an empty set is omitted on the wire: hosts treat an absent field as
  // empty, and detect old cores (which never send it) via the
  // `allow_peer_default_without_exit` presence bit.
  repeated string desired_proxy_cidrs = 16;
  // VIP dataplane reachability per connected peer, from the local VIP-echo
  // prober. Independent of the control-plane keepalive: a peer can be
  // "connected" (PeerRoutePair present) yet "unreachable" (no VIP echo
  // round-trip). Old cores never send it, so frontends treat absence as all
  // "unknown" rather than "unreachable".
  repeated api.instance.PeerVipReachability peer_vip_reachability = 17;
}

message NetworkInstanceRunningInfoMap {
  map<string, NetworkInstanceRunningInfo> map = 1;
}

message NetworkMeta {
  common.UUID inst_id = 1;
  string network_name = 2;
  uint32 config_permission = 3;
  string instance_name = 4;
  ConfigSource source = 5;
}

message ValidateConfigRequest { NetworkConfig config = 1; }

message ValidateConfigResponse { string toml_config = 1; }

message RunNetworkInstanceRequest {
  common.UUID inst_id = 1;
  NetworkConfig config = 2;
  bool overwrite = 3;
  ConfigSource source = 4;
}

message RunNetworkInstanceResponse { common.UUID inst_id = 1; }

message RetainNetworkInstanceRequest { repeated common.UUID inst_ids = 1; }

message RetainNetworkInstanceResponse {
  repeated common.UUID remain_inst_ids = 1;
}

message CollectNetworkInfoRequest { repeated common.UUID inst_ids = 1; }

message CollectNetworkInfoResponse { NetworkInstanceRunningInfoMap info = 1; }

message ListNetworkInstanceRequest {}

message ListNetworkInstanceResponse { repeated common.UUID inst_ids = 1; }

message DeleteNetworkInstanceRequest {
  repeated common.UUID inst_ids = 1;
  // true = console Stop: keep local config (GUI list and/or on-disk toml).
  // false/absent = console Delete / reconcile cleanup: purge local config.
  bool keep_local_config = 2;
}

message DeleteNetworkInstanceResponse {
  repeated common.UUID remain_inst_ids = 1;
}

message GetNetworkInstanceConfigRequest { common.UUID inst_id = 1; }

message GetNetworkInstanceConfigResponse {
  NetworkConfig config = 1;
  ConfigSource source = 2;
}

message ListNetworkInstanceMetaRequest { repeated common.UUID inst_ids = 1; }

message ListNetworkInstanceMetaResponse { repeated NetworkMeta metas = 1; }

message GetConfigServerStatusRequest {}

message GetConfigServerStatusResponse {
  // True when a config-server client is configured in this process.
  bool enabled = 1;
  // True when the config-server session is currently connected.
  bool connected = 2;
  // Last connect/handshake failure; empty when connected or not yet failed.
  string last_error = 3;
  // Non-fatal progress while connecting (e.g. phase:*). Empty when idle/connected.
  // Must not be treated as a failure; prefer this over stuffing progress into last_error.
  string connecting_detail = 4;
  // True after at least one heartbeat that carried console web-owned ids (W).
  // When false, clients must not prune GUI cache from web_owned_instance_ids.
  bool web_owned_instance_ids_valid = 5;
  // Console SQLite Web-source instance ids for this machine (enabled+disabled).
  repeated string web_owned_instance_ids = 6;
}

// Push a web-owned NetworkConfig from a GUI/RPC peer to the process that owns
// the config-server client (normal mode: self; service mode: ET-Gui service).
// error_code values (stable wire contract):
//   not_enabled | not_connected | not_authorized | revision_conflict |
//   ownership_conflict | invalid
message ReportManagedNetworkConfigRequest { NetworkConfig config = 1; }

message ReportManagedNetworkConfigResponse {
  bool ok = 1;
  // Empty on success. Otherwise one of the wire codes listed above.
  string error_code = 2;
  string current_config_revision = 3;
  string applied_config_revision = 4;
  string message = 5;
}

service WebClientService {
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse) {}
  rpc RunNetworkInstance(RunNetworkInstanceRequest)
      returns (RunNetworkInstanceResponse) {}
  rpc RetainNetworkInstance(RetainNetworkInstanceRequest)
      returns (RetainNetworkInstanceResponse) {}
  rpc CollectNetworkInfo(CollectNetworkInfoRequest)
      returns (CollectNetworkInfoResponse) {}
  rpc ListNetworkInstance(ListNetworkInstanceRequest)
      returns (ListNetworkInstanceResponse) {}
  rpc DeleteNetworkInstance(DeleteNetworkInstanceRequest)
      returns (DeleteNetworkInstanceResponse) {}
  rpc GetNetworkInstanceConfig(GetNetworkInstanceConfigRequest)
      returns (GetNetworkInstanceConfigResponse) {}
  rpc ListNetworkInstanceMeta(ListNetworkInstanceMetaRequest)
      returns (ListNetworkInstanceMetaResponse) {}
  rpc GetConfigServerStatus(GetConfigServerStatusRequest)
      returns (GetConfigServerStatusResponse) {}
  rpc ReportManagedNetworkConfig(ReportManagedNetworkConfigRequest)
      returns (ReportManagedNetworkConfigResponse) {}
}
