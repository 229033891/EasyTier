syntax = "proto3";

import "common.proto";
import "api_manage.proto";

package web;

message DeviceOsInfo {
  string os_type = 1;
  string version = 2;
  string distribution = 3;
}

message HeartbeatRequest {
  common.UUID machine_id = 1;
  common.UUID inst_id = 2;
  string user_token = 3;

  string easytier_version = 4;
  string report_time = 5;
  string hostname = 6;

  repeated common.UUID running_network_instances = 7;
  DeviceOsInfo device_os = 8;
  bool support_config_source = 9;
  repeated common.UUID failed_network_instances = 10;
  bool support_heartbeat_policy = 11;
  // When true, disabled_network_instances is the client's full set of
  // user-disabled web-managed instance IDs. Older clients leave this false
  // so the server must not treat an empty list as "enable everything".
  bool support_user_disabled_instances = 12;
  repeated common.UUID disabled_network_instances = 13;
}

message HeartbeatResponse {
  optional uint32 heartbeat_interval_ms = 1;
  optional uint32 heartbeat_timeout_ms = 2;
  // Current persisted managed-config revision for this machine, if any.
  optional string managed_config_revision = 3;
}

message GetFeatureRequest {}

message GetFeatureResponse {
  bool support_encryption = 1;
}

// Client → console: push an edited web-owned NetworkConfig with revision CAS.
message ReportNetworkConfigRequest {
  common.UUID machine_id = 1;
  string user_token = 2;
  api.manage.NetworkConfig config = 3;
  // Must match the client's cached heartbeat revision (empty when none exists).
  string expected_config_revision = 4;
  // Client-minted target revision; must differ from expected_config_revision.
  string config_revision = 5;
}

message ReportNetworkConfigResponse {
  bool ok = 1;
  string applied_config_revision = 2;
  // On conflict, the server's current revision so the client can refresh.
  string current_config_revision = 3;
  // empty | managed_config_revision_conflict | managed_config_ownership_conflict | invalid_request
  string error_code = 4;
}

service WebServerService {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetFeature(GetFeatureRequest) returns (GetFeatureResponse);
  rpc ReportNetworkConfig(ReportNetworkConfigRequest) returns (ReportNetworkConfigResponse);
}
