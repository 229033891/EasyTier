syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "common.proto";
import "api_instance.proto";

package magic_dns;

message DnsRecordA {
    string name = 1;
    common.Ipv4Addr value = 2;
    int32 ttl = 3;
}

message DnsRecordSOA {
    string name = 1;
    string value = 2;
}

message DnsRecord {
    oneof record {
        DnsRecordA a = 1;
        DnsRecordSOA soa = 2;
    }
}

message DnsRecordList {
    repeated DnsRecord records = 1;
}

// R1 static hosts channel (dns-policy.md §5). Long TTL; not the 1s route path.
message StaticDnsHost {
    string name = 1;
    repeated string ips = 2;
    optional uint32 ttl_secs = 3;
}

message UpdateDnsRecordRequest {
    string zone = 1;
    repeated api.instance.Route routes = 2;
    // Hint for static hosts bookkeeping. Use "static-hosts" when publishing
    // DnsConfig.hosts. Server stores under "static-hosts:<tunnel remote>".
    optional string client = 3;
    repeated StaticDnsHost static_hosts = 4;
}

message GetDnsRecordResponse {
    map<string, DnsRecordList> records = 1;
}

message HandshakeRequest {}

message HandshakeResponse {}

service MagicDnsServerRpc {
    rpc Handshake(HandshakeRequest) returns (HandshakeResponse) {}
    rpc Heartbeat(common.Void) returns (common.Void) {}
    rpc UpdateDnsRecord(UpdateDnsRecordRequest) returns (common.Void) {}
    rpc GetDnsRecord(common.Void) returns (GetDnsRecordResponse) {}
}
