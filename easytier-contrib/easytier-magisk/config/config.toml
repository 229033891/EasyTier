instance_name = "default"
dhcp = false
#ipv4="本机ip"
listeners = [
    "tcp://0.0.0.0:11010",
    "udp://0.0.0.0:11010",
    "wg://0.0.0.0:11011",
    "ws://0.0.0.0:11011/",
    "wss://0.0.0.0:11012/",
]
mapped_listeners = []
exit_nodes = []
rpc_portal = "0.0.0.0:15888"

[network_identity]
network_name = "default"
network_secret = ""

# 有序保底 peer URL（按可达性填写；443 不一定可用）
#[[peer]]
#uri = "tcp://relay.example.com:11010"
#[[peer]]
#uri = "wss://relay.example.com:8443/et"
#[[peer]]
#uri = "wss://relay.example.com/et"

[flags]
default_protocol = "udp,tcp"
dev_name = ""
enable_encryption = true
enable_ipv6 = true
mtu = 1280
latency_first = false
enable_exit_node = false
no_tun = false
use_smoltcp = false
relay_network_whitelist = "*"
disable_p2p = false
relay_all_peer_rpc = false
disable_udp_hole_punching = false
disable_tcp_hole_punching = false


