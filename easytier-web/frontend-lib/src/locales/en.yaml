traffic_routing: Smart Routing
traffic_routing_summary: "Gateway (allow as exit / subnet proxy) and egress (steering: policy routes before the exit list; local route table: custom routes) live here; they are usually configured as a pair."
traffic_routing_client: Egress
traffic_routing_steering: Steering
traffic_routing_local_routes: Local Route Table
traffic_routing_gateway: Gateway

latency_first: Enable Quality-First Routing
latency_first_help: |-
  By default routes use fewest hops; with this on, they minimize total path quality cost (latency + loss + jitter) and may take an extra hop when that is better.
  Useful when nodes are spread across regions and end-to-end experience matters more than hop count.
  Note: nodes keep reporting link quality, which adds a little control-plane overhead. Best set consistently across the network.
  Config key remains latency_first for compatibility.

use_smoltcp: Use User-Space Protocol Stack
use_smoltcp_help: |-
  Handle subnet-proxy and KCP-proxy traffic with the user-space smoltcp stack, bypassing the OS firewall and routing table.
  Useful when subnet proxy does not work, or the host has strict firewall rules.
  Note: user-space throughput is lower than kernel forwarding, so only enable it when you actually hit a problem.

disable_ipv6: Disable IPv6
disable_ipv6_help: |-
  This node stops using IPv6 entirely: no IPv6 listeners, no IPv6 peer connections, everything over IPv4.
  Useful when peers only support IPv4, or a broken local IPv6 route is what blocks connectivity.
  Note: keep it consistent with the other nodes, otherwise they may fail to connect.

allow_ipv6: Enable IPv6
allow_ipv6_help: |-
  When checked, this node may communicate over IPv6 (checked by default).
  Unchecking equals "Disable IPv6": IPv4 only, useful when peers lack IPv6 or local IPv6 is broken.

ipv6_public_addr_auto: Auto Public IPv6
ipv6_public_addr_auto_help: |-
  Automatically request a public IPv6 address from a peer that shares its public IPv6 subnet.
  Useful when this host has no public IPv6 but some node in the network can provide one.
  Note: the network must contain a node sharing its public IPv6 subnet (that side can only be configured in easytier-core, Linux only), otherwise no address is assigned.

enable_kcp_proxy: Enable KCP Proxy
enable_kcp_proxy_help: |-
  Carry TCP traffic to peers over KCP (UDP-based) instead of raw TCP.
  On lossy links this avoids TCP retransmission stalls, noticeably cutting latency and raising throughput.
  Note: both ends must support KCP; if the peer has "Allow KCP Input" turned off, it falls back to raw TCP.

disable_kcp_input: Disable KCP Input
disable_kcp_input_help: |-
  Refuse KCP-proxied TCP streams from others; this node only accepts raw TCP.
  Useful when this node is CPU-bound, or the link is lossless so KCP brings no benefit.
  Note: peers with KCP proxy on fall back to raw TCP automatically — nothing breaks, you just lose the KCP benefit.

allow_kcp_input: Allow KCP Input
allow_kcp_input_help: |-
  Accept KCP-proxied TCP streams from others (allowed by default).
  Unchecking it is equivalent to "Disable KCP Input": this node only accepts raw TCP — useful when the node is CPU-bound, or the link is lossless so KCP brings no benefit.
  Note: peers with KCP proxy on fall back to raw TCP automatically — nothing breaks, you just lose the KCP benefit.

enable_quic_proxy: Enable QUIC Proxy
enable_quic_proxy_help: |-
  Carry TCP traffic to peers over QUIC (UDP-based) instead of raw TCP.
  Same purpose as the KCP proxy — lower latency and higher throughput on lossy links; QUIC has more mature congestion control and multiplexing.
  Note: both ends must support QUIC; if the peer has "Allow QUIC Input" turned off, it falls back to raw TCP.

disable_quic_input: Disable QUIC Input
disable_quic_input_help: |-
  Refuse QUIC-proxied TCP streams from others; this node only accepts raw TCP.
  Useful when this node is CPU-bound, or the link is lossless so QUIC brings no benefit.
  Note: peers fall back to raw TCP automatically — nothing breaks.

allow_quic_input: Allow QUIC Input
allow_quic_input_help: |-
  Accept QUIC-proxied TCP streams from others (allowed by default).
  Unchecking it is equivalent to "Disable QUIC Input": this node only accepts raw TCP — useful when the node is CPU-bound, or the link is lossless so QUIC brings no benefit.
  Note: peers fall back to raw TCP automatically — nothing breaks.

disable_p2p: Disable P2P
disable_p2p_help: |-
  Stop establishing direct (P2P) connections proactively — all traffic goes through relays — and advertise that peers should not connect to this node directly either.
  Useful for turning this node into a pure relay/server, or when direct links must be tightly restricted.
  Note: nodes marked "Need P2P" are the exception and will still establish a direct connection.

allow_p2p: Allow P2P Direct
allow_p2p_help: |-
  Allow this node to establish direct (P2P) connections proactively, cutting relay overhead and latency (allowed by default).
  Unchecking it is equivalent to "Disable P2P": all traffic goes through relays, and peers are told not to connect to this node directly — useful for turning this node into a pure relay/server, or when direct links must be tightly restricted.
  Note: nodes marked "Need P2P" are the exception and will still establish a direct connection.

p2p_only: P2P Only
p2p_only_help: |-
  Talk only to peers with an established direct (P2P) connection; never fall back to a relay.
  Useful when end-to-end latency matters and direct connectivity is guaranteed.
  Note: peers that cannot connect directly (e.g. both behind symmetric NAT with failed hole punching) become completely unreachable. Use with care.

lazy_p2p: Lazy P2P
lazy_p2p_help: |-
  Do not pre-establish direct links to every peer; only attempt hole punching when traffic actually targets that peer.
  Useful for networks with many nodes where only a few are ever used — less control-plane churn and fewer pointless hole-punch attempts.
  Note: the first exchange pays an extra connection-setup delay. Peers marked "Need P2P" are still connected proactively.

bind_device: Bind to Physical Device Only
bind_device_help: |-
  Bind the underlying sockets to a physical NIC so they never go out through a virtual interface.
  Typical case: the subnet-proxy segment overlaps a peer's segment, so traffic loops inside the virtual network — binding to the physical NIC restores normal connectivity.
  Note: the host must expose a usable physical NIC; pure virtualized/container environments may not have one.

no_tun: No TUN Mode
no_tun_help: |-
  Do not create a TUN interface: this host gets no virtual IP and cannot reach other nodes' virtual IPs directly.
  Useful on machines without administrator privileges (cannot install the TUN driver) — peers can still reach services on this host through a subnet proxy.
  Note: to reach addresses inside the virtual network from this host, use the SOCKS5 proxy (see "Socks5 Server" below).

enable_exit_node: Allow This Node as Exit
enable_exit_node_help: |-
  Gateway-side switch: accept internet / policy-route traffic that peers send here, and egress it (or forward via this host's subnet proxy).
  Useful when this host has a stable public uplink (or proxied LANs) that others can share.
  Note: clients must still list this node under "Exit Nodes" or "Policy Routes"; this switch alone does not advertise a default route. Relaying consumes this host's bandwidth.

allow_peer_default_without_exit: Allow Peer Default Without Exit
allow_peer_default_without_exit_help: |-
  Escape hatch: install a peer-advertised 0.0.0.0/0 into the OS route table even when this node has no reachable Exit Nodes entry.
  Default is off — peer /0 stays L3-only unless you enable this or configure Exit Nodes.
  Caution: on mobile (Android / OHOS) this becomes a real full-tunnel VPN with no metric demotion.

relay_all_peer_rpc: Relay RPC Packets
relay_all_peer_rpc_help: |-
  Relay RPC control packets for all peers, even those outside the relay network whitelist.
  Helps peers in non-whitelisted networks establish P2P connections.
  Note: control plane only — it does not relay data-plane traffic, so it will not let non-whitelisted networks route payload through this node.

disable_relay_data: Disable Relay Data
disable_relay_data_help: |
  Prevent other nodes from relaying data-plane traffic through this node.
  This node can still communicate normally; when enabled, avoid_relay_data is advertised so route computation avoids it with a very large cost.
  Note: avoidance only, no drops — transit packets arriving during convergence or on sole-path topologies are still forwarded.

allow_relay_data: Allow as Relay Node
allow_relay_data_help: |-
  When checked, other nodes may relay data-plane traffic through this node (checked by default).
  Unchecking equals `disable_relay_data = true` in the backend (written as `disable-relay-data = true` in the config file): route computation avoids this node, but in-flight transit packets are still forwarded, never dropped; good for terminal-only devices.
  Note: with "P2P only" enabled, relaying is meaningless and cannot be re-checked.

need_p2p: Need P2P
need_p2p_help: |-
  Announce that peers should connect to this node proactively even when they have Lazy P2P enabled.
  Useful when this node is a frequent target (a server, or a subnet-proxy egress) that should stay directly reachable.
  Note: it only makes a difference for peers with Lazy P2P on; if a peer has P2P fully disabled, this has no effect.

multi_thread: Multi Thread
multi_thread_help: |-
  Use the multi-threaded Tokio runtime (single-threaded by default).
  Useful for relays/servers with many peers and heavy forwarding, where extra cores can be put to work.
  Note: the thread count comes from multi-thread-count on the easytier-core side (default 2). With few nodes the gain is marginal and scheduling overhead grows.

proxy_forward_by_system: System Forward
proxy_forward_by_system_help: |-
  Hand subnet-proxy packets to the OS kernel for forwarding (system routes/firewall rules) instead of EasyTier's built-in user-space NAT.
  Useful when you need kernel-level policy routing, or the built-in NAT conflicts with an existing firewall.
  Note: the kernel must be able to forward (on Linux, enable ip_forward and add the matching allow rules). Misconfiguration makes subnet proxy fail outright.

disable_encryption: Disable Encryption
disable_encryption_help: |-
  Turn off encryption between peers (on by default).
  Useful inside a fully trusted LAN, saving a little CPU.
  Note: it must match the other nodes — one side encrypted and the other not simply will not connect. Never disable it on the public internet.

allow_encryption: Enable Encryption
allow_encryption_help: |-
  When checked, traffic between peers is encrypted (checked by default).
  Unchecking equals "Disable Encryption": trusted LANs only, must match all nodes, never on the public internet.

disable_tcp_hole_punching: Disable TCP Hole Punching
disable_tcp_hole_punching_help: |-
  Stop attempting TCP hole punching for direct connections.
  Useful when TCP hole punching makes connections unstable on a particular network, or conflicts with the peer's firewall policy.
  Note: without it, TCP-only cases fall back to relays and usually get slower; if UDP hole punching works, direct connectivity is generally unaffected.

allow_tcp_hole_punching: Allow TCP Hole Punching
allow_tcp_hole_punching_help: |-
  Allow TCP hole punching for direct connections (allowed by default).
  Unchecking it is equivalent to "Disable TCP Hole Punching": useful when TCP hole punching makes connections unstable on a particular network, or conflicts with the peer's firewall policy.
  Note: without it, TCP-only cases fall back to relays and usually get slower; if UDP hole punching works, direct connectivity is generally unaffected.

disable_udp_hole_punching: Disable UDP Hole Punching
disable_udp_hole_punching_help: |-
  Stop attempting UDP hole punching for direct connections.
  Useful when the ISP rate-limits or scrubs UDP, so hole punching only wastes time.
  Note: connectivity then depends on TCP hole punching or relays, so the P2P success rate drops.

allow_udp_hole_punching: Allow UDP Hole Punching
allow_udp_hole_punching_help: |-
  Allow UDP hole punching for direct connections (allowed by default).
  Unchecking it is equivalent to "Disable UDP Hole Punching": useful when the ISP rate-limits or scrubs UDP, so hole punching only wastes time.
  Note: connectivity then depends on TCP hole punching or relays, so the P2P success rate drops.

enable_udp_broadcast_relay: UDP Broadcast Relay
enable_udp_broadcast_relay_help: "Windows only: capture local UDP broadcast packets from physical interfaces and forward them to EasyTier peers. Helps games to find rooms in local network. Requires administrator privileges."

disable_upnp: Disable UPnP
disable_upnp_help: |-
  Turn off runtime UPnP / NAT-PMP port mapping (on by default).
  Useful when the router does not support UPnP, or you do not want the app changing port mappings on its own.
  Note: with this off, if the host sits behind NAT nobody can connect inbound — only outbound connections and hole punching remain. Set up the port mapping on the router manually instead.

allow_upnp: Enable UPnP Port Mapping
allow_upnp_help: |-
  Turn on runtime UPnP / NAT-PMP port mapping (on by default).
  Unchecking it is equivalent to "Disable UPnP": useful when the router does not support UPnP, or you do not want the app changing port mappings on its own.
  Note: with this off, if the host sits behind NAT nobody can connect inbound — only outbound connections and hole punching remain. Set up the port mapping on the router manually instead.

disable_sym_hole_punching: Disable Symmetric NAT Hole Punching
disable_sym_hole_punching_help: |-
  Disable UDP hole punching for symmetric NAT (NAT4). That technique enumerates ports via a "birthday attack" and can be flagged as anomalous traffic by the ISP.
  Useful when enabling it gets you throttled or cut off, or the environment cannot tolerate a burst of probe packets.
  Note: with it disabled, two symmetric-NAT peers generally cannot connect directly and must use a relay.

allow_sym_hole_punching: Allow Symmetric NAT Hole Punching
allow_sym_hole_punching_help: |-
  Allow UDP hole punching for symmetric NAT (NAT4) (allowed by default). That technique enumerates ports via a "birthday attack" and can be flagged as anomalous traffic by the ISP.
  Unchecking it is equivalent to "Disable Symmetric NAT Hole Punching": useful when enabling it gets you throttled or cut off, or the environment cannot tolerate a burst of probe packets.
  Note: with it disabled, two symmetric-NAT peers generally cannot connect directly and must use a relay.

enable_magic_dns: Enable Magic DNS
enable_magic_dns_help: |-
  Enable magic DNS: reach other nodes as <hostname>.et.net (e.g. node1.et.net) without remembering virtual IPs.
  Useful if you often address nodes by hostname.
  Note: it modifies this host's DNS settings (needs the corresponding privileges). The default zone is et.net; change it with tld-dns-zone on the easytier-core side.
  When off: domain policies are still saved in this network config, but they only take effect once Magic DNS is enabled, and the three DNS editors below stay read-only until then.
  In no-TUN mode, Magic DNS usually does not auto-wire into the OS resolver.

enable_private_mode: Enable Private Mode
enable_private_mode_help: |-
  Private mode: a foreign network may only handshake or relay through this node if it can be confirmed to use the same network secret; different or missing secrets are rejected.
  Useful for strictly isolating your network from other EasyTier networks.
  Note: the decision is based on the network secret — roll out secret changes everywhere at once, or nodes will start rejecting each other.

prefer_peer_relay: Prefer Peer Relay
prefer_peer_relay_help: |-
  (Legacy TOML-only; hidden in the console.) Prefer reusing a peer that is already
  relaying toward the destination to keep the control-plane edge set smaller.
  Affects OSPF topology projection only — it does not delay hole punching; same-peer
  multi-path selection still uses the quality score (RTT / loss / jitter).
  Note: only applies between already-credentialed peers.

# Mutex / dependency hints (Current behaviour only; legacy conflicting values are kept and warned)
disable_p2p_conflict_help: |-
  "Allow P2P Direct" is off while "P2P Only / Lazy P2P / Need P2P" is on. With P2P disallowed the others have no effect — clear one side. Values are not rewritten automatically.
disable_p2p_blocks_help: When "Allow P2P Direct" is off, you cannot enable P2P Only, Lazy P2P, or Need P2P.
p2p_only_blocks_disable_p2p_help: When "P2P Only" is on, direct P2P must stay enabled.
p2p_only_latency_first_conflict_help: |-
  With "P2P Only" enabled, quality-first routing is ignored at runtime. Values are not rewritten; you can turn quality-first routing off manually.
p2p_only_blocks_latency_first_help: Quality-first routing has no effect while "P2P Only" is on, so it cannot be enabled.
p2p_only_relay_conflict_help: |-
  "P2P Only" means no relaying; relay options (Disable Relay Data / Prefer Peer Relay / network whitelist) have no effect. Values are not rewritten.
p2p_only_blocks_relay_help: Relay-related options have no effect while "P2P Only" is on.
all_hole_punching_disabled_help: |-
  Both TCP and UDP hole punching are off: direct links need manual peers or relays. Valid, but confirm a path remains reachable.
kcp_proxy_no_input_conflict_help: |-
  KCP proxy is on while KCP input is disabled (send-only). Valid but usually a misconfiguration; peers fall back to plain TCP toward this node.
dual_proxy_conflict_help: |-
  Enabling both KCP and QUIC proxy increases overhead; usually keep only one.
disable_ipv6_conflict_help: |-
  IPv6 is disabled but public-IPv6 options are still on. Those options have no effect while IPv6 is off; values are not rewritten.
no_tun_dev_mtu_conflict_help: |-
  In no-TUN mode, TUN name and MTU have no effect. Values are not rewritten.
no_tun_dev_mtu_hint: Ignored in no-TUN mode.
no_tun_exit_nodes_hint: Without a TUN device, exit-node default routes usually cannot be installed into the system routing table.
disable_encryption_algo_conflict_help: |-
  Encryption algorithm has no effect while encryption is disabled. Values are not rewritten.
disable_encryption_algo_hint: Encryption is disabled; algorithm selection is ignored.

default_protocol: Protocol Order
default_protocol_help: |-
  Ordered protocol list (stored as CSV). Direct connect tries the peer's advertised listeners in this order.
  Manual peer URLs dial the configured scheme first, and only fail over by rewriting among tcp/udp/ws/wss/quic (host and ports kept; never forced to 443). wg and faketcp stay in the list for Direct sort but are never rewritten on manual peers.
  Default is udp,tcp: every other common transport (tcp/ws/wss/quic/faketcp) retransmits on its own, which turns an inner TCP flow (RDP/SSH/HTTP) into TCP over TCP that stalls under mild packet loss; tcp stays second so "UDP is blocked, fall back to TCP" still works. Example wss,tcp,quic,udp: if UDP is blocked, TCP/WSS from the list are still tried.
  Interactive use (RDP / SSH): if UDP is known to work, narrow the list to udp only to avoid TCP-over-TCP; keep tcp/wss as fallback where UDP is blocked — do not leave udp alone in that case.
  Chip order in the dropdown is try order; newly checked schemes are appended in catalog order — uncheck and re-check to change relative position.
  ⚠️ This list sets priority only, it does not exclude: unchecked schemes sort last and are still tried.
  ⚠️ "Bonded Link Count" truncates the dial chain: dialing stops once N schemes succeed (N = bond count), so entries after the Nth are usually never reached unless the earlier ones fail. Keep tcp early as the fallback.

encryption_algorithm: Encryption Algorithm
encryption_algorithm_help: |-
  Algorithm used to encrypt peer traffic. Options: aes-gcm (default), aes-256-gcm, chacha20, xor.
  xor is only weak obfuscation, not real encryption — use it only on very low-end devices, or when a peer explicitly requires it.
  Note: it must match the other nodes; it has no effect while "Disable Encryption" is on.
encryption_algorithm_placeholder: Leave blank for the default (aes-gcm)

data_compress_algo: Data Compression
data_compress_algo_help: |-
  Compress forwarded payloads: none (default, off) or zstd.
  Enable zstd when bandwidth is tight and the payload compresses well; the gain is small when the CPU is busy or the data is already encrypted/compressed.
  Note: both ends must support the chosen algorithm.

socket_mark: SO_MARK
socket_mark_help: |-
  Linux only: set SO_MARK (fwmark) on every outbound underlay socket so you can policy-route or filter them with `ip rule fwmark ...`, nftables `meta mark`, or iptables `-m mark`.
  Leave blank to leave SO_MARK untouched; enter 0 to set it explicitly to 0 (0 is also a valid mark, so this is not the same as unset).
  Note: requires CAP_NET_ADMIN. FakeTCP's real payload is written via raw TUN writes, which the kernel does not tag.
socket_mark_placeholder: Leave blank to leave it unset

ipv6_public_addr_provider: Share IPv6 Subnet
ipv6_public_addr_provider_help: |-
  Share this node's public IPv6 subnet with other peers so they can obtain public IPv6 addresses (Linux only).
  Useful when this host has a public IPv6 prefix (e.g. /64) and you want the rest of the network to get public IPv6 too.
  Note: peers must enable "Auto Public IPv6" on their side. Leave the prefix below blank to auto-detect from system routes.
ipv6_public_addr_prefix_placeholder: "Leave blank to auto-detect, e.g.: 2001:db8:1234:5678::/64"

relay_network_whitelist: Network Whitelist
relay_network_whitelist_help: |
  Only forward traffic from the whitelist networks, supporting wildcard strings, multiple network names can be separated by spaces.
  If this parameter is empty, forwarding is disabled. By default, all networks are allowed.
  e.g.: '*' (all networks), 'def*' (networks with the prefix 'def'), 'net1 net2' (only allow net1 and net2)

manual_routes: Manual Route
manual_routes_help: |-
  Specify this node's routing table by hand (CIDR list). Once set, subnet proxy and WireGuard routes propagated from peers are both disabled and routing is controlled here instead.
  Useful when routes must be exact, or auto-propagated routes clash with the local network.
  Note: leave blank to go back to automatic mode. A wrong entry silently breaks that segment. e.g.: 192.168.0.0/16

manual_routes_append: Append to auto routes
manual_routes_append_help: |-
  When on, the manual route list is added to the auto-computed set (subnet proxies + policy routes) instead of replacing it, and the exit-node list still auto-installs 0.0.0.0/0.
  Default off = legacy behaviour: the manual list takes over the auto-computed set, and the exit-node list no longer auto-installs 0.0.0.0/0.
  In both modes, a 0.0.0.0/0 written in the manual list or an explicit policy-route 0.0.0.0/0 still applies (this host declares full tunnel); the peer-default escape hatch belongs to the auto set and stays overridden in replace mode.
  Desktop installs rule subnets into the system route table; Android / OHOS do not (unless a full-tunnel exit is on, or the subnet is written into the manual list).

socks5: Socks5 Server
socks5_help: |-
  Run a SOCKS5 proxy on this host so clients connecting through it can reach addresses inside the virtual network (commonly paired with No TUN Mode).
  Format: <port>, e.g. 1080.
  Note: leave blank to keep it off. Before exposing it, restrict the sources — otherwise it becomes an open proxy.

exit_nodes: Exit Nodes
exit_nodes_help: |-
  Exit node list: fill in the peer's virtual IPv4 address. This host installs a TUN default route and, once traffic enters the overlay, forwards internet traffic to the first reachable exit (with a next hop) in list order.
  The peer must have "Enable Exit Node" turned on, or L3 will not accept that traffic.
  Note: if installing/removing the system default or underlay excludes fails, the status page shows desired vs installed and the process retries periodically; internet access may be disrupted until routes land. A wrong or unreachable address cuts off all internet access — verify reachability first.

policy_routes: Policy Routes
policy_routes_help: |-
  Send traffic for a target CIDR and/or domain to a chosen gateway peer; matches take precedence over the exit node list.
  Note: the peer you point at must have "Enable Exit Node" turned on, or it drops that traffic. Domain rules rely on this host's MagicDNS (queries that bypass EasyTier DNS are invisible), and the first connection has a direct-egress window of up to 1 second.
  On desktop, rule CIDRs and learned /32s are installed into the OS route table. Tauri mobile and OHOS install hand-written manual routes but not policy CIDRs. Android JNI builds (new client) match desktop; old JNI builds only install peer CIDRs and the exit /0.
policy_routes_dns_observe_off: Domain rules learn target IPs via this host's MagicDNS. Magic DNS is off for this network, so no IP is learned.
policy_routes_dns_observe_unsupported: This network enables no_tun, so MagicDNS is not wired and domain rules will not learn any IP — use CIDR rules instead.
policy_routes_dns_observe_version: The target device runs EasyTier older than 2.7.4, which ignores domain policy, so domain rules never take effect.
policy_routes_add: Add route
policy_routes_remove: Remove this route
policy_routes_cidr: Target CIDR
policy_routes_cidr_placeholder: e.g. 10.0.0.0/24
policy_routes_cidr_help: |-
  One IPv4 CIDR this rule matches (e.g. 10.0.0.0/24). Only one CIDR per rule.
  May be set together with domains, or alone; at least one of CIDR / domains is required.
policy_routes_domains: Target domains
policy_routes_domains_placeholder: e.g. *.atlassian.net
policy_routes_domains_help: |-
  Domains this rule matches. Add multiple chips (Enter, comma, or blur), up to 64.
  Supports *.parent.tld (leftmost single-label wildcard; parent needs ≥2 labels). Relies on MagicDNS. May be set with CIDR or alone.
policy_routes_peers: Gateway peers
policy_routes_peers_placeholder: e.g. 10.144.0.9
policy_routes_peers_help: |-
  Peer virtual IPv4 gateways (1–16). List order is preference when Selection is “In list order”.
  Type one IP and press Enter to commit it as a chip; comma-separated values (or blur) also commit.
  Each peer must have Enable Exit Node on, or traffic is dropped.
policy_routes_select_by: Selection
policy_routes_select_by_help: |-
  How to pick among multiple gateway peers: list order / best quality / spread by flow.
  "Spread by flow" distributes flows across the candidates by inner-flow 5-tuple hash, **evenly** — not weighted by link quality or capacity. One flow always keeps one gateway.
  When a default-route rule merges the exit-node list, that merged candidate pool is what "Spread by flow" hashes over — not only the peers column on this row. Check Status → Effective policy routes to see the live list.
  "Best link quality" compares the cost of the **whole path** to a candidate (relay hops included), so a candidate reachable only through a relay is ranked correctly.
  With "never" fail over only the first candidate is kept, so it can only be paired with "In list order"; the other modes are rejected by config validation.
policy_routes_effective: Effective policy routes
policy_routes_effective_help: |-
  Runtime view after merging exit nodes into default-route rules. Config peers alone cannot show sugar /0 rules or the live candidate pool. An empty sugar /0 is hidden when no exit nodes are configured.
policy_routes_effective_cidr: Match
policy_routes_effective_candidates: Effective candidates
policy_routes_effective_config_peers: Config peers
policy_routes_effective_select: Selection
policy_routes_effective_state: State
policy_routes_effective_pinned: Pinned peer
policy_routes_effective_pinned_help: |-
  "Never" fail over pins the rule to one peer: traffic keeps going to it even while it is unreachable, instead of falling back to another gateway or to the physical network. This column shows that peer.
policy_routes_effective_costs: Cost (source)
policy_routes_effective_costs_help: |-
  Composite link cost per candidate, with where the number came from. Both sources use the same unit, but "path" is the accumulated weight of the whole path (relay hops and relay penalties included) and "edge" is a local measurement of the direct link only — shown while the route table does not know the peer yet. The degraded threshold is compared against whichever one applies.
policy_routes_effective_sugar: sugar /0
policy_routes_select_by_priority: In list order
policy_routes_select_by_quality: Best link quality
policy_routes_select_by_balance: Spread by flow
policy_routes_failover_when: Fail over
policy_routes_failover_when_help: |-
  When to move to the next candidate: unreachable / quality degraded / never.
  "Never" pins the rule to the first candidate: traffic keeps going to it even while it is unreachable, instead of falling back to another gateway or to the physical network. Use "When a candidate is unreachable" if you want an automatic fallback instead.
policy_routes_failover_unreachable: When a candidate is unreachable
policy_routes_failover_degraded: When quality degrades
policy_routes_failover_never: Never
policy_routes_if_all_unavailable: When all candidates are down
policy_routes_if_all_unavailable_help: |-
  If every gateway candidate is down: fall back to the physical default gateway, or drop (no fallback). Drop requires confirming the risk as soon as the rule can end up with more than one candidate — its peers plus any exit nodes merged into a default route.
policy_routes_all_unavailable_open: Fall back to the physical gateway
policy_routes_all_unavailable_closed: Drop (no fallback)
policy_routes_require_confirmed: I accept the packet-drop risk
policy_routes_quality_degraded_cost: Degraded threshold (composite cost)
policy_routes_quality_degraded_cost_help: |-
  Composite-cost ceiling for “quality degraded” failover. Only with Fail over = When quality degrades; must be a positive integer.
policy_routes_target_required: Set at least one of CIDR / domains.

dns:
  title: Domain Policy
  hosts:
    title: Static Hosts
    editor_help: "Highest priority. Static entries are authoritative on MagicDNS and override route hostnames. Use *.suffix (syntax: leftmost single-label * only, parent needs at least two labels so *.com is rejected; matching is RFC 4592 multi-label, e.g. *.corp.example → foo.corp.example and a.b.corp.example). Unmatched names fall through to split DNS / upstream DNS."
    name: Hostname
    name_placeholder: "e.g. app.internal. or *.corp.example"
    ips: IPv4 addresses
    ttl: TTL
    ttl_unit: seconds
    add: Add host
    add_tip: Add a static DNS host entry
    remove: Remove host
    skip:
      empty: Hostname is empty; this entry will be skipped.
      wildcard_needs_parent: Wildcards need a parent domain, e.g. *.corp.example.
      multi_wildcard: Only leftmost single-label wildcards are supported, e.g. *.corp.example.
      invalid_wildcard_parent: Invalid wildcard parent domain; this entry will be skipped.
      invalid_star: Use *.suffix for wildcards, or an exact hostname.
      empty_zone: The resolved zone is empty; this entry will be skipped.
      single_label_zone: Static hosts need at least a two-label zone (e.g. corp.example); *.com is rejected.
    invalid_ips: "These IPs are invalid and will be skipped: {ips}"
    invalid_ips_all_drop: This entry has no usable IP, so the whole host takes no effect.
  upstream:
    title: Upstream DNS
    help: |-
      Ordered failover list when static hosts and split DNS do not match.
      Add multiple upstreams, e.g. 1.1.1.1, 8.8.8.8, or udp://9.9.9.9:53.
      Empty keeps system DNS. Phase 1 accepts IP literals only; hostnames are rejected.
    placeholder: "e.g. 1.1.1.1, then add 8.8.8.8"
    server: Server
    server_placeholder: "e.g. 1.1.1.1 or udp://9.9.9.9:53"
    add: Add upstream
    add_tip: Add an upstream DNS server
    remove: Remove upstream
    invalid_entry: This upstream address is invalid and will be skipped (IP literals only, e.g. 1.1.1.1 or udp://9.9.9.9:53).
  forwarders:
    title: Split DNS
    editor_help: Route matching domain suffixes to dedicated upstream servers (before default upstream). Upstream servers are IP literals only in phase 1.
    domains: Domains
    servers: Servers
    add: Add forwarder
    add_tip: Add a split DNS forwarder
    remove: Remove forwarder
    invalid_servers: "These upstream servers are invalid and will be skipped: {servers}"
    invalid_domains: "These domains are blank and will be skipped: {domains}"
    row_skipped: This forwarder has no usable domain or usable upstream; the whole row will be skipped.
  coverage:
    label: DNS coverage
    covered: Auto
    covered_help: With Magic DNS enabled, this platform should wire OS DNS to MagicDNS automatically.
    covered_platform_help: Platform can auto-wire OS DNS when Magic DNS is enabled on a network.
    manual_required: Manual
    manual_required_help: "Magic DNS hosts may be stored, but this OS needs manual DNS setup. See docs/current/magic-dns-manual-wiring.md (OpenWrt dnsmasq: server=/et.net/10.255.255.254)."
    manual_required_platform_help: This OS typically needs manual Magic DNS wiring. See docs/current/magic-dns-manual-wiring.md. Badge assumes Magic DNS is enabled on the network.
    manual_required_docs: Manual setup guide
    manual_required_docs_url: https://github.com/229033891/EasyTier/blob/main/docs/current/magic-dns-manual-wiring.md
    unsupported: Unsupported
    unsupported_help: Magic DNS OS wiring is not available on this platform or configuration (e.g. no TUN, iOS).
    unsupported_platform_help: Magic DNS OS wiring is not available on this platform. Badge assumes Magic DNS is enabled on the network.
    version_too_old: Old client
    version_too_old_help: Client is older than 2.7.4 and cannot apply DnsConfig.hosts; if it becomes the MagicDNS server, static hosts may be silently dropped (mesh names may still resolve).
    version_too_old_platform_help: Client version is too old to apply DnsConfig.hosts from managed config.

port_forwards: Port Forward
port_forwards_help: "forward local port to remote port in virtual network. e.g.: udp://0.0.0.0:12345/10.126.126.1:23456, means forward local udp port 12345 to 10.126.126.1:23456 in the virtual network. can specify multiple."
port_forwards_bind_addr: "Bind address, e.g.: 0.0.0.0"
port_forwards_dst_addr: "Destination address, e.g.: 10.126.126.1"
port_forwards_add_btn: "Add"
port_forwards_add_tip: Add a rule that forwards a local port into the virtual network
edit_port_forward: "Edit Port Forward"

mtu: MTU
mtu_help: |-
  Configures flags.mtu (allowed range 400–1380). With encryption on, actual TUN MTU = value − 20; with encryption off, TUN = value.
  Factory default 1300 → TUN 1280 when encrypted (same as Tailscale's default); 1300 when unencrypted.
  Lower further (e.g. 1200) on poor/fragmenting links; raising helps bulk throughput but too large causes loss or black holes.
  Leave blank for the factory default; keep both ends consistent.
mtu_placeholder: Leave blank for default 1300

instance_recv_bps_limit: Instance Receive Limit
instance_recv_bps_limit_help: |-
  Cap the instance's total inbound rate. Unit: bytes per second (B/s) — not bits/s; 1 MB/s ≈ 8 Mbps.
  Useful to throttle a relay/server so a single instance cannot saturate the link.
  Leave blank for no limit.
instance_recv_bps_limit_placeholder: Leave blank for no limit

peer_link_bond_count: Bonded Link Count
peer_link_bond_count_help: |-
  Target number of PeerConns sending in parallel between a peer pair. Default 2 spreads different flows (inner IP 5-tuple) across tunnels when multiple same-quality-band tunnels are live.
  Quality first: much worse paths stay hot standby and do not join the send set; the actual count may be below this target when the band is thin. Set to 1 for a single default_conn (extra tunnels are hot standbys only). Max 5; a single RDP flow is still capped by one tunnel.
  A/B test: temporarily set 1 when isolating interactive stutter (know that multi-protocol dial fallback is disabled); keep factory 2 for normal use — do not leave 1 long-term.
  ⚠️ Setting 1 also disables multi-protocol dialing: only the first entry of "Protocol Order" is dialed and the rest are never tried, so a rate-limited udp will not fall back to tcp. Keep 2 to have a second protocol warm (standby tunnels cost no extra bandwidth when idle).
peer_link_bond_count_placeholder: Leave blank as default 2
peer_link_replica_fill_max: Same-Class Fill Limit
peer_link_replica_fill_max_help: |-
  Max bond members sharing one diversity class (protocol + remote) when filling within the same quality band. Default 2. Out-of-band worse paths are never pulled in just to reach the bond count. Egress / NIC diversity is a later phase.
  Leave blank for default.
peer_link_replica_fill_max_placeholder: Leave blank as default 2

ping_interval_max_sec: Keepalive Ping Max Interval (s)
ping_interval_max_sec_help: |-
  Upper bound the adaptive keepalive ping may back off to. Factory default 10s (since 2026-10, was 32s). Direct (non-hole-punched) tunnels use this global value; hole-punched tunnels keep their own shorter caps (TCP 1s / UDP 10s).
  Why 10: most carrier NATs expire an idle UDP mapping in 20-30s, and the old 32s direct-conn keepalive missed that window — once the mapping ages out, packets you send are silently dropped by the peer's NAT and you get a tens-of-seconds black-hole window (the connection looks alive, ping times out) until the keepalive refreshes the mapping or the conn is torn down and rebuilt. At 10s the mapping stays warm and the window disappears.
  Set 32 explicitly to restore the previous slower pacing. Leave blank for the factory default 10.
ping_interval_max_sec_placeholder: Leave blank as default 10

ping_fail_close_count: Conn Close Threshold (fails)
ping_fail_close_count_help: |-
  Consecutive keepalive failures before a PeerConn is declared dead and torn down for rebuild. Factory default 10.
  Lower rebuilds faster but tears down on brief jitter; higher tolerates jitter but lengthens the black-hole window. 10 balances the two.
  On lossy links you can raise it (e.g. 12–20). Also: if this peer has no other usable tunnel left, the node will not tear down the last path on keepalive failure (avoids a full freeze) and keeps probing until it recovers.
  Leave blank for the factory default 10.
ping_fail_close_count_placeholder: Leave blank as default 10

mapped_listeners: Public Advertise Addresses
mapped_listeners_help: |-
  Tell other nodes which public address reaches this one, for environments where automatic detection (UPnP / STUN) is wrong or unavailable.
  e.g.: tcp://123.123.123.123:11223, can specify multiple.
  Note: should match a local listen port above, and the address must be genuinely reachable (router port mapping already set up).

listener_urls_help: |-
  Addresses this node actually binds and listens on (local side).
  e.g.: tcp://0.0.0.0:11010. If peers need to reach you from the public Internet, also fill in Public Advertise Addresses below.

