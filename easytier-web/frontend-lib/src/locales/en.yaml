flow_stats:
  title: Flow stats
  enabled: Enable flow accounting
  enabled_help: |-
    Records which IPs each tunnel (PeerConn) carries: destination IPs on TX, source IPs on RX.
    When off, the hot path costs a single atomic read and allocates nothing.
    Data is aggregated locally on the node only (the "Live Traffic" panel on the status page) and is never uploaded to public servers.
  sample_rate: Sample rate
  sample_rate_help: 1 = account every packet; N = account 1 in N packets. Destination IP cardinality is usually tiny, so keep it at 1 unless the tunnel relays traffic to many distinct targets.
  max_per_conn: Max per tunnel
  max_per_conn_help: Maximum IP entries kept per tunnel; the least recently seen entries are evicted first.
  max_total: Max per node
  max_total_help: Maximum entries kept across all tunnels on this node, bounding memory use.
  mask_prefix_len_v4: IPv4 mask length
  mask_prefix_len_v4_help: Prefix length used when aggregating for the console/web UI. 24 means 10.0.0.0/24; minimum is 1 (0 is clamped to 1 by the node). Exact IPs require an EXACT request plus the node-side "allow exact IPs" switch.
  mask_prefix_len_v6: IPv6 mask length
  mask_prefix_len_v6_help: Same as above (minimum 1; 0 is clamped to 1); 64 aggregates by /64.
  allow_exact_ip: Allow exact IPs
  allow_exact_ip_help: |-
    Off by default: the console only ever receives masked subnets.
    When on, callers that explicitly request the EXACT view (local desktop GUI, CLI) can see exact IPs.
    This is the second half of the double opt-in; the first half is the caller's explicit request.
