initial_nodes: Initial Nodes
initial_nodes_help: |
  EasyTier does not distinguish between server and client roles.
  • Filling in Initial Nodes = plugging in the cable and joining an existing network.
  • Leaving it empty = the node starts alone until others connect to it, or you connect it later yourself.
  • Direct or indirect connectivity, including through relay nodes, can form one network.
  Initial nodes can be your own nodes or ones shared by others.
  Enter full tunnel URLs (scheme/host/port/path). Examples:
  • tcp://relay.example.com:11010
  • wss://relay.example.com/et (port 443 when omitted)
  • wss://relay.example.com:8443/et or tcp://10.0.0.2:5000 (custom ports)
  Port 443 is recommended when your network allows it, but many networks block 443 or only allow specific ports — use the exact URL your relay listens on. All configured addresses stay connected; the active path is picked automatically by latency/jitter/loss quality.
