port_forwards: Port Forward
port_forwards_help: "forward local port to remote port in virtual network. e.g.: udp://0.0.0.0:12345/10.126.126.1:23456, means forward local udp port 12345 to 10.126.126.1:23456 in the virtual network. can specify multiple."
port_forwards_bind_addr: "Bind address, e.g.: 0.0.0.0"
port_forwards_dst_addr: "Destination address, e.g.: 10.126.126.1"
port_forwards_add_btn: "Add"
port_forwards_add_tip: Add a rule that forwards a local port into the virtual network
edit_port_forward: "Edit Port Forward"

mtu: MTU
mtu_help: |-
  MTU of the TUN interface (largest payload per packet). Defaults: 1380 unencrypted, 1360 encrypted. Allowed range: 400–1380.
  Lower it (e.g. 1200) on poor links that fragment often to reduce loss; raise it for better bulk throughput.
  Note: leave blank to use the default. Too large a value causes packet loss or outright failures on some links.
mtu_placeholder: Leave blank as default value 1380

instance_recv_bps_limit: Instance Receive Limit
instance_recv_bps_limit_help: |-
  Cap the instance's total inbound rate. Unit: bytes per second (B/s) — not bits/s; 1 MB/s ≈ 8 Mbps.
  Useful to throttle a relay/server so a single instance cannot saturate the link.
  Leave blank for no limit.
instance_recv_bps_limit_placeholder: Leave blank for no limit

mapped_listeners: Public Advertise Addresses
mapped_listeners_help: |-
  Tell other nodes which public address reaches this one, for environments where automatic detection (UPnP / STUN) is wrong or unavailable.
  e.g.: tcp://123.123.123.123:11223, can specify multiple.
  Note: should match a local listen port above, and the address must be genuinely reachable (router port mapping already set up).

