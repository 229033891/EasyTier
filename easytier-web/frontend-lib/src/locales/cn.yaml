path_quality_help: |-
  同 peer 多隧道时的综合质量分（越低越好：延迟 + 丢包 + 抖动）。
  ★ 为当前发送路径（default_conn）；· / +N 为热备，用于选优与故障切换——不是带宽聚合。
  仅当「多链路聚合数」>1 且单元格出现 bond×N 时，不同流才会分摊到多条隧道。
  `!` 表示丢包超过熔断阈值。
