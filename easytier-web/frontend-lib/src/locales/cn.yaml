    help: |-
      静态主机与分流 DNS 均未命中时，按添加顺序依次 failover。
      可添加多个上游，例如 1.1.1.1、8.8.8.8，或 udp://9.9.9.9:53。
      为空则沿用系统 DNS。首期仅支持 IP 字面量，不支持域名。
    placeholder: "例如 1.1.1.1，再添加 8.8.8.8"
    server: 上游
    server_placeholder: "例如 1.1.1.1 或 udp://9.9.9.9:53"
    add: 添加上游
    add_tip: 添加一条上游 DNS
    remove: 删除上游
  forwarders:
    title: 分流 DNS
    editor_help: 将匹配的域名后缀转发到指定上游（优先于默认上游）。上游为首期仅 IP 字面量。
    domains: 域名
    domains_placeholder: "例如 corp.example."
    servers: 上游
    servers_placeholder: "例如 10.0.0.53"
    add: 添加分流
    add_tip: 添加一条分流 DNS 规则
    remove: 删除分流
  coverage:
    label: DNS 覆盖
    covered: 自动
    covered_help: 启用魔法 DNS 后，此平台应能自动将系统 DNS 接到 MagicDNS。
    covered_platform_help: 此平台在启用魔法 DNS 时通常可自动接线系统 DNS（徽章未读取具体网络开关）。
    manual_required: 需手动
    manual_required_help: 静态 hosts 可能已下发，但此系统需按文档手动配置 DNS。见 docs/current/magic-dns-manual-wiring.md（OpenWrt dnsmasq：server=/et.net/10.255.255.254）。
    manual_required_platform_help: 此系统通常需手动配置 Magic DNS。见 docs/current/magic-dns-manual-wiring.md。徽章假定网络上已启用魔法 DNS。
    manual_required_docs: 手工接线说明
    manual_required_docs_url: https://github.com/EasyTier/EasyTier/blob/main/docs/current/magic-dns-manual-wiring.md
    unsupported: 不支持
    unsupported_help: 此平台或配置无法自动接线 Magic DNS（如 no_tun、iOS）。
    unsupported_platform_help: 此平台无法自动接线 Magic DNS；徽章假定网络上已启用魔法 DNS。
    version_too_old: 客户端过旧
    version_too_old_help: 客户端低于 2.7.4，无法应用 DnsConfig.hosts；若它当选 MagicDNS server，静态 hosts 可能静默丢失（mesh 域名仍可能可解析）。
    version_too_old_platform_help: 客户端版本过旧，无法应用控制台下发的 DnsConfig.hosts。

port_forwards: 端口转发
port_forwards_help: "将本地端口转发到虚拟网络中的远程端口。例如：udp://0.0.0.0:12345/10.126.126.1:23456，表示将本地UDP端口12345转发到虚拟网络中的10.126.126.1:23456。可以指定多个。"
port_forwards_bind_addr: "绑定地址，如：0.0.0.0"
port_forwards_dst_addr: "目标地址，如：10.126.126.1"
port_forwards_add_btn: "添加"
port_forwards_add_tip: 添加一条本地端口到虚拟网络的转发规则
edit_port_forward: "编辑端口转发"

mtu: MTU
mtu_help: |-
  TUN 虚拟网卡的 MTU（单个数据包的最大字节数）。默认：不加密 1380、加密 1360；可填范围 400–1380。
  链路质量差、经常触发分片时调小（例如 1200）可以减少丢包；调大能提升大流量吞吐。
  注意：留空使用默认值；设置过大会导致部分链路丢包甚至不通。
mtu_placeholder: 留空为默认值1380

instance_recv_bps_limit: 实例接收限速
instance_recv_bps_limit_help: |-
  限制本实例的入站总速率，单位是「字节/秒」（B/s）—— 注意不是 bit/s，1 MB/s ≈ 8 Mbps。
  适合给中继/服务器节点限流，避免被单个实例占满带宽。
  留空表示不限速。
instance_recv_bps_limit_placeholder: 留空表示不限速

peer_link_bond_count: 多链路聚合数
peer_link_bond_count_help: |-
  一对 peer 之间并行发送的目标 PeerConn 条数。1（默认）只走单条 default_conn：多条存活隧道仍是热备切换，不会叠带宽。
  2–5 按内层 IP 五元组把不同流分摊到多条隧道，可突破单连接限速（多用户/多流场景最有效；单个 RDP 等单流仍受单条上限）。
  需要有多条存活隧道才有效；上限 5。
peer_link_bond_count_placeholder: 留空为默认值1
peer_link_replica_fill_max: 同类补齐上限
peer_link_replica_fill_max_help: |-
  补齐 bond 集合时，同一多样性类别（协议 + 对端地址）的成员数量上限，默认 5。出口/网卡多样性属后续阶段。
  留空为默认值。
peer_link_replica_fill_max_placeholder: 留空为默认值5

mapped_listeners: 公网宣告地址
mapped_listeners_help: |-
  告诉其他节点「用哪个公网地址能连到我」，用于 UPnP / STUN 自动探测不准或不可用的环境。
  例如：tcp://123.123.123.123:11223，可以指定多个。
  注意：须与上方「本机监听」对应，且路由器已做好端口映射、地址真实可达，否则对端会连不上。

listener_urls_help: |-
  本机实际绑定并监听的地址（对内）。
  例如：tcp://0.0.0.0:11010。需要被外网访问时，请再在下方填写「公网宣告地址」。

