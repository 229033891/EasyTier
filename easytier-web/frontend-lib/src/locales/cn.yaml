latency_first: 开启质量优先选路
latency_first_help: |-
  默认按「中转跳数最少」选路；开启后改为按「综合质量代价最低」选路（延迟 + 丢包 + 抖动，必要时可多绕一跳）。
  适合节点分散在不同地域、需要跨多跳中转，且更在意端到端体验的网络。
  注意：依赖各节点持续上报链路质量，会略微增加控制面开销；同一网络内建议统一设置。
  配置键仍为 latency_first（兼容旧配置）。

use_smoltcp: 使用用户态协议栈
use_smoltcp_help: |-
  用用户态 smoltcp 协议栈处理「子网代理」和「KCP 代理」的流量，绕开系统防火墙/路由表对这类流量的干扰。
  适合子网代理不通、或系统防火墙策略较严的场景。
  注意：用户态协议栈的吞吐低于内核转发，只在遇到问题时才建议开启。

disable_ipv6: 禁用IPv6
disable_ipv6_help: |-
  本节点完全不使用 IPv6：不监听 IPv6，也不通过 IPv6 与其他节点通信，全部走 IPv4。
  适合对端只支持 IPv4，或本机 IPv6 路由异常导致连不上时排查。
  注意：需要和网络内其他节点的设置保持一致，否则可能连不上。

allow_ipv6: 启用 IPv6
allow_ipv6_help: |-
  勾选后本节点可使用 IPv6 通信（默认勾选）。
  取消勾选等价于「禁用 IPv6」：只走 IPv4，适合对端无 IPv6 或本机 IPv6 异常时排查。

ipv6_public_addr_auto: 自动获取公网 IPv6
ipv6_public_addr_auto_help: |-
  自动向「共享了公网 IPv6 子网」的对等节点申请一个公网 IPv6 地址。
  适合本机没有公网 IPv6、但网络里有节点能提供的情况。
  注意：网络里必须存在一台共享了公网 IPv6 子网的节点（该能力目前只能在 easytier-core 侧配置，且仅 Linux 支持），否则拿不到地址。

enable_kcp_proxy: 启用 KCP 代理
enable_kcp_proxy_help: |-
  把发往对端的 TCP 流量改用 KCP（基于 UDP）代理转发。
  在 UDP 有丢包的链路上，能避开 TCP 重传导致的卡顿，明显降低延迟、提高吞吐。
  注意：需要两端都能跑 KCP；若对端开了「禁用 KCP 输入」，会自动回退为原始 TCP。

disable_kcp_input: 禁用 KCP 输入
disable_kcp_input_help: |-
  不接受别人用 KCP 代理过来的 TCP 流，本节点只收原始 TCP。
  适合本节点 CPU 紧张，或链路本身不丢包（KCP 收益不大）时。
  注意：开启 KCP 代理的对端访问本节点时会自动回退成原始 TCP，功能不受影响，只是失去 KCP 的收益。

enable_quic_proxy: 启用 QUIC 代理
enable_quic_proxy_help: |-
  把发往对端的 TCP 流量改用 QUIC（基于 UDP）代理转发。
  用途与 KCP 代理类似，在丢包链路上降低延迟、提高吞吐；QUIC 的拥塞控制与多路复用更成熟。
  注意：需要两端都支持 QUIC；若对端开了「禁用 QUIC 输入」，会自动回退为原始 TCP。

disable_quic_input: 禁用 QUIC 输入
disable_quic_input_help: |-
  不接受别人用 QUIC 代理过来的 TCP 流，本节点只收原始 TCP。
  适合本节点 CPU 紧张，或链路不丢包（QUIC 收益不大）时。
  注意：对端会自动回退成原始 TCP，功能不受影响。

disable_p2p: 禁用 P2P
disable_p2p_help: |-
  不再主动与其他节点建立直连（P2P），流量一律走中转；同时声明不希望别人主动连本节点。
  适合让本节点只做中继/服务器，或需要严格限制直连关系的场景。
  注意：标记了「需要 P2P」的节点例外，仍会与本节点建立直连。

p2p_only: 仅 P2P
p2p_only_help: |-
  只与已建立直连（P2P）的节点通信，完全不经过其他节点中转。
  适合对端到端延迟敏感、且能确保直连可达的场景。
  注意：无法直连的节点（例如双方都在对称 NAT 后且打洞失败）将完全无法通信，慎用。

lazy_p2p: 延迟 P2P
lazy_p2p_help: |-
  不预先为每个节点建直连，等真的要和它传数据时才去尝试打洞建连。
  适合节点多、但实际只与少数节点通信的网络，可减少控制面开销和无效打洞。
  注意：首次通信会多一次建连延迟；标记了「需要 P2P」的节点仍会被主动连接。

bind_device: 仅使用物理网卡
bind_device_help: |-
  建立连接时把底层套接字绑定到物理网卡，不走虚拟网卡。
  典型场景：子网代理的网段和某个节点的网段冲突，导致流量在虚拟网里绕圈；绑定物理网卡后可正常通信。
  注意：需要本机能识别出物理网卡，纯虚拟化/容器环境可能没有可用物理网卡。

no_tun: 无 TUN 模式
no_tun_help: |-
  不创建 TUN 虚拟网卡：本机不会获得虚拟 IP，也不能直接访问其他节点的虚拟 IP。
  适合没有管理员权限（装不了 TUN 驱动）的机器 —— 此时其他节点仍能通过子网代理访问本机上的服务。
  注意：本机要主动访问虚拟网内的地址，需要借助 SOCKS5 代理（见下方「socks5 服务器」）。

enable_exit_node: 启用出口节点
enable_exit_node_help: |-
  允许本节点充当「出口节点」：其他节点可以把全部上网流量转发到本节点，由本节点代为出网。
  适合本机有稳定公网出口，想让其他节点借用这条出口的场景。
  注意：需要在客户端侧把本节点填进「出口节点列表」才会生效；转发他人流量会消耗本机带宽，请自行控制使用范围。

allow_peer_default_without_exit: 无出口时允许对端默认路由
allow_peer_default_without_exit_help: |-
  逃生阀：即使本机没有可到达的「出口节点」，也把对端通告的 0.0.0.0/0 写入系统路由表。
  默认关闭——对端 /0 只保留在 L3 选路，除非开启本项或配置了可达的出口节点。
  注意：在移动端（Android / OHOS）上这会变成真正的全隧道 VPN（没有桌面端那种高度量降权）。

relay_all_peer_rpc: 转发RPC包
relay_all_peer_rpc_help: |-
  转发所有对等节点的 RPC 控制包，即使该节点不在「网络白名单」中。
  用于帮助白名单之外网络里的节点建立 P2P 连接。
  注意：只影响控制面 RPC，不转发业务数据 —— 开了它不会让白名单外网络的业务流量通过本节点。

disable_relay_data: 禁止中转数据
disable_relay_data_help: |
  禁止其他节点通过本节点转发业务流量（数据面中继）。
  本节点仍可正常通信；开启后会向网络宣告 avoid_relay_data，算路时以极大代价避开本节点。
  注意：仅算路避让，不丢包——收敛期间或无替代路径时到达的中转包仍会被正常转发。

allow_relay_data: 允许作为中转节点
allow_relay_data_help: |-
  勾选后，其他节点可经由本节点中转业务流量（默认勾选）。
  取消勾选等价于高级设置里的「禁止中转数据」：算路时会避开本节点，但收敛期间到达的中转包仍会被转发，不会丢包；适合只做终端的设备。
  注意：开启「仅 P2P」时中转无意义，不可重新勾选。

need_p2p: 需要 P2P
need_p2p_help: |-
  对外声明：即使对方开启了「延迟 P2P」，也请主动与本节点建立直连。
  适合本节点是对端经常访问的目标（例如服务器、子网代理出口），希望随时可直连。
  注意：只在对方开启「延迟 P2P」时才有区别；对方完全禁用 P2P 时本条不生效。

multi_thread: 启用多线程
multi_thread_help: |-
  使用多线程 Tokio 运行时（默认单线程）。
  适合节点数多、转发流量大的中继/服务器节点，能更好地利用多核。
  注意：线程数由 easytier-core 侧的 multi-thread-count 决定（默认 2）；节点少时开启收益不明显，反而增加调度开销。

proxy_forward_by_system: 系统转发
proxy_forward_by_system_help: |-
  子网代理的数据包交给系统内核转发（走系统路由/防火墙规则），不再使用 EasyTier 内置的用户态 NAT。
  适合需要在内核层做策略路由，或内置 NAT 与现有防火墙冲突的场景。
  注意：要求本机内核具备转发能力（Linux 需开启 ip_forward 并配置放行规则），配置不当会直接导致子网代理不通。

disable_encryption: 禁用加密
disable_encryption_help: |-
  关闭节点间通信的加密（默认开启）。
  适合在完全可信的内网里运行，换取一点 CPU 开销。
  注意：必须与网络内其他节点设置一致 —— 一边加密一边不加密会直接连不通；公网环境不要关闭。

allow_encryption: 启用加密
allow_encryption_help: |-
  勾选后节点间通信加密（默认勾选）。
  取消勾选等价于「禁用加密」：仅在完全可信的内网使用；必须全网一致，公网环境不要关闭。

disable_tcp_hole_punching: 禁用TCP打洞
disable_tcp_hole_punching_help: |-
  不再尝试用 TCP 打洞建立直连。
  适合 TCP 打洞在特定网络下反而导致连接不稳定，或与对端防火墙策略冲突时。
  注意：关闭后 TCP 场景只能走中转，延迟通常更高；如果 UDP 打洞可用，一般不影响直连。

disable_udp_hole_punching: 禁用UDP打洞
disable_udp_hole_punching_help: |-
  不再尝试用 UDP 打洞建立直连。
  适合 UDP 被运营商限制/清洗、打洞只会白耗时间的网络。
  注意：关闭后只能靠 TCP 打洞或走中转，P2P 成功率会下降。

enable_udp_broadcast_relay: UDP 广播中继
enable_udp_broadcast_relay_help: "仅 Windows：捕获物理网卡上的本机 UDP 广播包并转发给 EasyTier 对等节点，帮助局域网游戏发现房间。需要管理员权限。"

disable_upnp: 禁用 UPnP
disable_upnp_help: |-
  关闭运行时的 UPnP / NAT-PMP 自动端口映射（默认开启）。
  适合路由器不支持 UPnP，或不想让程序自动修改路由器端口映射的场景。
  注意：关闭后如果本机在 NAT 后面，别人将无法直接连进来，只能由本机主动出连或依赖打洞；需要手动在路由器上做端口映射。

disable_sym_hole_punching: 禁用对称NAT打洞
disable_sym_hole_punching_help: |-
  禁用针对对称 NAT（NAT4）的 UDP 打洞。该方式基于「生日攻击」枚举端口，可能被运营商判定为异常流量而封锁。
  适合开启后出现被限速/断流，或环境不允许大量探测包的场景。
  注意：禁用后对称 NAT 两侧基本无法直连，只能走中转。

enable_magic_dns: 启用魔法DNS
enable_magic_dns_help: |-
  启用魔法 DNS：可以直接用「主机名.et.net」访问其他节点（例如 node1.et.net），无需记虚拟 IP。
  适合经常按主机名访问节点的场景。
  注意：会修改本机的 DNS 设置（需要相应权限）；域名后缀默认 et.net，可在 easytier-core 侧用 tld-dns-zone 调整。

enable_private_mode: 启用私有模式
enable_private_mode_help: |-
  私有模式：只有能确认「网络密码与本网络一致」的外部网络，才允许借道本节点握手或中转；密码不一致或缺失的一律拒绝。
  适合想把自己网络与其他 EasyTier 网络严格隔离的场景。
  注意：判定依赖网络密码，改密码时要全网同步，否则会出现节点之间互相拒绝。

prefer_peer_relay: 优先对端中继
prefer_peer_relay_help: |-
  （高级/TOML 遗留项，控制台不展示。）优先复用「已经在向目标转发数据的对端」，减少控制面直连边宣告。
  只影响 OSPF 拓扑投影，不抑制打洞；同 peer 多路径仍按质量分（延迟/丢包/抖动）选择。
  注意：仅作用于已有凭据对端之间的路径选择。

# 互斥 / 依赖提示（只描述 Current 行为；老配置冲突值保留，仅提示）
disable_p2p_conflict_help: |-
  当前同时开启了「禁用 P2P」与「仅 P2P / 延迟 P2P / 需要 P2P」。禁用 P2P 时后三者无意义；请取消其一。配置不会被自动改写。
disable_p2p_blocks_help: 已开启「禁用 P2P」时，不能再勾选仅 P2P、延迟 P2P 或需要 P2P。
p2p_only_blocks_disable_p2p_help: 已开启「仅 P2P」时，不能再勾选禁用 P2P。
p2p_only_latency_first_conflict_help: |-
  「仅 P2P」开启时，质量优先选路会被运行时忽略。配置不会被自动改写；可手动关闭质量优先选路。
p2p_only_blocks_latency_first_help: 已开启「仅 P2P」时，质量优先选路无效，无法勾选。
p2p_only_relay_conflict_help: |-
  「仅 P2P」表示不走中转；中继相关选项（禁止中转数据 / 优先对端中继 / 网络白名单）此时无意义。配置不会被自动改写。
p2p_only_blocks_relay_help: 已开启「仅 P2P」时，中继相关选项无效。
all_hole_punching_disabled_help: |-
  TCP 与 UDP 打洞均已关闭：直连只能依赖手动 peer 或中转。这是合法配置，但请确认中转/手动节点可达。
kcp_proxy_no_input_conflict_help: |-
  本机开启了 KCP 代理却禁用了 KCP 输入：只发不收。合法但多为误配；对端访问本机时会回退为原始 TCP。
dual_proxy_conflict_help: |-
  KCP 代理与 QUIC 代理同时开启会增加开销；通常只保留其一即可。
disable_ipv6_conflict_help: |-
  已禁用 IPv6，但公网 IPv6 相关选项仍为开启。禁用 IPv6 时这些选项无效；配置不会被自动改写。
no_tun_dev_mtu_conflict_help: |-
  无 TUN 模式下 TUN 名称与 MTU 不生效。配置不会被自动改写。
no_tun_dev_mtu_hint: 无 TUN 模式下此项无效。
no_tun_exit_nodes_hint: 无 TUN 时出口节点默认路由通常无法装入系统路由表。
no_tun_magic_dns_hint: 无 TUN 模式下 Magic DNS 通常不会自动接线。
disable_encryption_algo_conflict_help: |-
  已禁用加密时，加密算法下拉无效。配置不会被自动改写。
disable_encryption_algo_hint: 已禁用加密，算法设置无效。

default_protocol: 连接协议优先顺序
default_protocol_help: |-
  有序协议列表（逗号分隔存盘）。直连按此顺序尝试对端已宣告的监听。
  手动 peer URL 仅在 tcp/udp/ws/wss/quic 之间改写 scheme 降级（保留主机与端口，不锁死 443）；wg / faketcp 仍可用于直连排序，但不会对手动 peer 改写。
  默认仅 tcp。例如 wss,tcp,quic,udp：UDP 被阻断时仍可落到列表中的 TCP/WSS。
  选择顺序即优先顺序；可用下方序号按钮微调。

encryption_algorithm: 加密算法
encryption_algorithm_help: |-
  节点间数据加密使用的算法。可选：aes-gcm（默认）、aes-256-gcm、chacha20、xor。
  xor 只是弱混淆、不是真正的加密，仅在极低端设备、或对端明确要求时才用。
  注意：必须与网络内其他节点一致；开了「禁用加密」后此项无效。
encryption_algorithm_placeholder: 留空为默认 aes-gcm

data_compress_algo: 数据压缩
data_compress_algo_help: |-
  对转发的数据做压缩：none（不压缩，默认）或 zstd（压缩）。
  带宽紧张且数据可压缩度高时，开 zstd 能省带宽；CPU 紧张或数据本身已加密/已压缩时收益很小。
  注意：两端都要支持所选算法。

socket_mark: SO_MARK
socket_mark_help: |-
  仅 Linux：给本节点所有底层出站套接字设置 SO_MARK（fwmark），方便用 `ip rule fwmark ...`、nftables 的 `meta mark`、iptables 的 `-m mark` 做策略路由或过滤。
  留空 = 完全不设置 SO_MARK；填 0 = 显式设为 0（两者不是一回事，0 也是一个合法的 mark）。
  注意：需要 CAP_NET_ADMIN 权限；FakeTCP 的实际载荷通过原始 TUN 写入，内核不会给它打标记。
socket_mark_placeholder: 留空表示不设置

ipv6_public_addr_provider: 共享 IPv6 子网
ipv6_public_addr_provider_help: |-
  把本节点的公网 IPv6 子网共享给其他节点，让它们也能获得公网 IPv6 地址（仅 Linux 支持）。
  适合本机有公网 IPv6 前缀（例如 /64），想让网络内其他节点也拿到公网 IPv6 的场景。
  注意：对端需要开启「自动获取公网 IPv6」；下面的前缀留空则从系统路由自动检测。
ipv6_public_addr_prefix_placeholder: 留空则自动检测，例如：2001:db8:1234:5678::/64

relay_network_whitelist: 网络白名单
relay_network_whitelist_help: |
  仅转发白名单网络的流量，支持通配符字符串。多个网络名称间可以使用英文空格间隔。
  如果该参数为空，则禁用转发。默认允许所有网络。
  例如：'*'（所有网络），'def*'（以def为前缀的网络），'net1 net2'（只允许net1和net2）

manual_routes: 自定义路由
manual_routes_help: |-
  手动指定本节点的路由表（CIDR）。设置后，「子网代理」和从对等节点传播过来的 WireGuard 路由都会被禁用，改由这里手动控制。
  适合路由需要精确控制，或自动传播的路由与本地网络冲突的场景。
  注意：留空即恢复自动模式；填错会导致对应网段不通。例如：192.168.0.0/16

socks5: socks5服务器
socks5_help: |-
  在本机开一个 SOCKS5 代理，客户端连上它就能访问虚拟网内的地址（常与「无 TUN 模式」搭配使用）。
  格式：<端口>，例如：1080。
  注意：留空表示不启用；对外暴露前请确认已限制来源，避免被当成开放代理。

exit_nodes: 出口节点列表
exit_nodes_help: |-
  出口节点列表：填对端的虚拟 IPv4 地址。本机会把默认上网路由指向虚拟网，进网后按列表顺序把公网流量转发给第一个可达且有下一跳的出口。
  对端必须开启「允许此节点成为出口节点」，否则 L3 接不住这些流量。
  注意：装/卸系统默认路由或 underlay 排除失败时，状态页可看「期望 vs 已安装」摘要，进程会周期性重试；在路由装好前本机上网可能短暂异常。填错地址或出口不可达会导致完全断网，请先确认可达。

dns:
  title: DNS 策略
  hosts:
    title: 静态主机
    enable: 配置策略
    enable_tip: 添加静态主机、分流转发与默认上游 DNS
    magic_dns_off_hint: DNS 策略会保存在本网络配置中；需开启「启用魔法 DNS」后才会接线生效。
    editor_help: 最高优先级。静态条目在 MagicDNS 上为权威记录，优先于路由 hostname；未命中时再看分流 DNS / 上游 DNS。
    name: 主机名
    name_placeholder: "例如 app.internal. 或 db.et.net"
    ips: IPv4 地址
    ips_placeholder: "例如 10.1.2.3"
    ttl: TTL
    ttl_unit: 秒
    add: 添加主机
    add_tip: 添加一条静态 DNS 主机
    remove: 删除主机
  upstream:
