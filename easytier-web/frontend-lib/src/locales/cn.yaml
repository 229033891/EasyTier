initial_nodes: 初始节点
initial_nodes_help: |
  EasyTier 不分服务端/客户端。
  • 填“初始节点” = 插上网线，直接加入已有网络。
  • 留空 = 节点独立启动，等别人来连，或你后续手动连。
  • 无论直接还是间接连通（通过其他节点搭桥），都能组网互通。
  初始节点可以用自己的，也可以用别人分享的。
  请填写完整隧道 URL（scheme/主机/端口/path）。示例：
  • tcp://relay.example.com:11010
  • wss://relay.example.com/et（省略端口时为 443）
  • wss://relay.example.com:8443/et 或 tcp://10.0.0.2:5000（自定义端口）
  网络允许时可用 443，但许多环境会阻断 443 或只放行特定端口——请按中继实际监听地址填写。全部已配置地址都会维持连接，实际走哪条按延迟/抖动/丢包质量自动选择。
